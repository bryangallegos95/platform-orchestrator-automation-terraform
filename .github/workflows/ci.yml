# ORG-DEVOPS/.github/workflows/ci.yml
#
# Reusable CI workflow — triggered on Pull Request from product repos.
#
# TOOLS:
#   - Terragrunt: wraps Terraform, backend injected via root terragrunt.hcl in son repo.
#   - Infracost:  cost estimate posted as PR comment after plan.
#
# DYNAMIC RESOLUTION (nothing hardcoded per environment):
#   branch → environment → runner label + state bucket
#   ou_name + repo_name  → state key
#   extra_vars           → -var flags (tgw_id, service, ambiente)
#
# JOBS:
#   ⓪ resolve  → derives environment, bucket, state key, runner label
#   ① format   → terragrunt hclfmt --check
#   ② lint     → tflint with AWS ruleset (after terragrunt init)
#   ③ plan     → terragrunt validate + plan, posts output as PR comment
#   ④ cost     → infracost breakdown, posts cost diff as PR comment

name: "[reusable] Terraform CI"

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to Terragrunt environment. E.g. environments/dev"
        required: true
        type: string
      account_id:
        description: "AWS account ID for the target environment. Provided by Port."
        required: true
        type: string
      ou_name:
        description: "OU / product name — root folder in state bucket. Provided by Port."
        required: true
        type: string
      extra_vars:
        description: |
          Space-separated Terraform -var overrides injected at plan time.
          Format: "key1=value1 key2=value2"
          Example: "tgw_id=tgw-0abc1234 service=datosanalitica ambiente=dev"
        required: false
        type: string
        default: ""
      terraform_version:
        required: false
        type: string
        default: "1.10.5"
      terragrunt_version:
        required: false
        type: string
        default: "0.69.10"
      tflint_version:
        required: false
        type: string
        default: "v0.55.0"
      target_role_name:
        required: false
        type: string
        default: "terraform-apply-role"
      aws_region:
        required: false
        type: string
        default: "us-east-1"
      bucket_prefix:
        required: false
        type: string
        default: "s3-aw-ue1-terraform-state"

    outputs:
      plan_exitcode:
        description: "0=no changes, 2=changes present."
        value: ${{ jobs.plan.outputs.exitcode }}
      plan_artifact_name:
        description: "Artifact name to pass to cd.yml."
        value: ${{ jobs.plan.outputs.artifact_name }}
      environment:
        description: "Resolved environment name."
        value: ${{ jobs.resolve.outputs.environment }}

concurrency:
  group: "tf-ci-${{ github.event.pull_request.number || github.ref_name }}-${{ github.base_ref || inputs.ou_name }}"
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  RESOLVE
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve environment"
    runs-on: [self-hosted, terraform]

    outputs:
      environment:  ${{ steps.derive.outputs.environment }}
      bucket:       ${{ steps.derive.outputs.bucket }}
      state_key:    ${{ steps.derive.outputs.state_key }}
      runner_label: ${{ steps.derive.outputs.runner_label }}

    steps:
      - name: Derive environment from branch
        id: derive
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          REPO="${{ github.event.repository.name }}"
          OU="${{ inputs.ou_name }}"
          PREFIX="${{ inputs.bucket_prefix }}"

          case "$BRANCH" in
            dev)     ENV="dev"     ;;
            qa)      ENV="qa"      ;;
            preprod) ENV="preprod" ;;
            prod)    ENV="prod"    ;;
            dr)      ENV="dr"      ;;
            *)
              echo "::error::Branch '$BRANCH' does not map to a known environment."
              exit 1 ;;
          esac

          BUCKET="${PREFIX}-${ENV}"
          STATE_KEY="${OU}/${REPO}/terraform.tfstate"

          echo "environment=$ENV"     >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET"       >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT
          echo "runner_label=$ENV"    >> $GITHUB_OUTPUT

          echo "### ⓪ Resolved values"                            >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"                                   >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"                                          >> $GITHUB_STEP_SUMMARY
          echo "| Branch      | \`$BRANCH\`    |"                 >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`$ENV\`        |"                 >> $GITHUB_STEP_SUMMARY
          echo "| Bucket      | \`$BUCKET\`     |"                 >> $GITHUB_STEP_SUMMARY
          echo "| State key   | \`$STATE_KEY\`  |"                 >> $GITHUB_STEP_SUMMARY
          echo "| Account ID  | \`${{ inputs.account_id }}\` |"   >> $GITHUB_STEP_SUMMARY
          echo "| Extra vars  | \`${{ inputs.extra_vars }}\` |"   >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  #  FORMAT
  #  terragrunt hclfmt checks .hcl files.
  # ─────────────────────────────────────────────
  format:
    name: "① Format"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ inputs.terragrunt_version }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: terragrunt hclfmt
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt hclfmt --check --diff

  # ─────────────────────────────────────────────
  #  LINT
  # ─────────────────────────────────────────────
  lint:
    name: "② Lint"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ inputs.terragrunt_version }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ inputs.aws_region }}
          role-session-name: "tf-lint-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}"

      - name: Terragrunt init (generates .tf files for TFLint)
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: Init TFLint
        working-directory: ${{ inputs.working_directory }}
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        working-directory: ${{ inputs.working_directory }}
        run: tflint --enable-plugin=aws --format=compact

  # ─────────────────────────────────────────────
  #  VALIDATE + PLAN
  # ─────────────────────────────────────────────
  plan:
    name: "③ Validate + Plan"
    needs: [resolve, format, lint]
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]

    outputs:
      exitcode:      ${{ steps.plan.outputs.exitcode }}
      artifact_name: ${{ steps.artifact_name.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ inputs.terragrunt_version }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ inputs.aws_region }}
          role-session-name: "tf-ci-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}"

      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Terragrunt validate
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt validate

      - name: Terragrunt plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          # Build -var flags from extra_vars input.
          EXTRA_VAR_FLAGS=""
          for pair in ${{ inputs.extra_vars }}; do
            EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
          done

          set +e
          eval terragrunt plan \
            $EXTRA_VAR_FLAGS \
            -out=tfplan \
            -input=false \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt
          EXITCODE=${PIPESTATUS[0]}
          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT
          if [ "$EXITCODE" -eq "1" ]; then
            echo "::error::Terragrunt plan failed."
            exit 1
          fi
          exit 0

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ github.token }}
          script: |
            const fs  = require('fs');
            const raw = fs.readFileSync('${{ inputs.working_directory }}/plan_output.txt', 'utf8');
            const MAX = 65000;
            const planText = raw.length > MAX
              ? raw.slice(0, MAX) + '\n\n⚠️ Output truncated — see Actions for full log.'
              : raw;

            const exitcode  = '${{ steps.plan.outputs.exitcode }}';
            const noChanges = exitcode === '0';
            const env       = '${{ needs.resolve.outputs.environment }}';
            const bucket    = '${{ needs.resolve.outputs.bucket }}';
            const stateKey  = '${{ needs.resolve.outputs.state_key }}';
            const sha       = '${{ github.sha }}'.slice(0, 7);

            const body = [
              `## 🔍 Terraform Plan — \`${env}\` ${noChanges ? '✅ No changes' : '⚠️ Changes detected'}`,
              '',
              '| | |',
              '|---|---|',
              `| **Environment**  | \`${env}\` |`,
              `| **Account ID**   | \`${{ inputs.account_id }}\` |`,
              `| **Directory**    | \`${{ inputs.working_directory }}\` |`,
              `| **State bucket** | \`${bucket}\` |`,
              `| **State key**    | \`${stateKey}\` |`,
              `| **Extra vars**   | \`${{ inputs.extra_vars }}\` |`,
              `| **Commit**       | \`${sha}\` |`,
              `| **Triggered by** | @${{ github.actor }} |`,
              '',
              noChanges
                ? '> ℹ️ No infrastructure changes. Apply will be skipped in CD.'
                : '> ⚡ Plan saved. CD applies this **exact plan** after merge — no re-plan.',
              '',
              '<details><summary>📋 Plan output (expand)</summary>',
              '',
              '```hcl',
              planText,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot'
                && c.body.includes('Terraform Plan')
                && c.body.includes(`\`${env}\``)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

      - name: Build artifact name
        id: artifact_name
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ENV="${{ needs.resolve.outputs.environment }}"
          echo "value=tfplan-${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 5
          if-no-files-found: error

  # ─────────────────────────────────────────────
  #  COST ESTIMATE (Infracost)
  #  Runs only on PRs when there are changes.
  #  Posts a cost diff comment alongside the plan.
  #  Requires: INFRACOST_API_KEY repo secret.
  # ─────────────────────────────────────────────
  cost:
    name: "④ Cost estimate"
    needs: [resolve, plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.exitcode == '2'
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ inputs.terragrunt_version }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ inputs.aws_region }}
          role-session-name: "infracost-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}"

      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ${{ inputs.working_directory }}

      - name: Convert plan to JSON
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt show -json tfplan > tfplan.json

      - name: Generate Infracost estimate
        working-directory: ${{ inputs.working_directory }}
        run: |
          infracost breakdown \
            --path tfplan.json \
            --format json \
            --out-file infracost.json

      - name: Post cost estimate to PR
        uses: infracost/actions/comment@v3
        with:
          path: ${{ inputs.working_directory }}/infracost.json
          behavior: update
          github-token: ${{ github.token }}
