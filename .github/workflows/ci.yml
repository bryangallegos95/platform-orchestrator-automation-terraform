# ORG-DEVOPS/.github/workflows/ci.yml
#
# Reusable CI workflow — called by product (son) repos.
#
# PREREQUISITES:
#   Runner image v2.0.0+ with pre-installed:
#   Terraform, Terragrunt, TFLint (+ AWS plugin), Infracost, gh CLI
#
# JOBS:
#   ⓪ resolve    → derives bucket, state key, region from environment input
#   ① format     → terragrunt hclfmt --check
#   ② lint       → tflint with AWS ruleset (plugin pre-installed in image)
#   ③ plan       → terragrunt validate + plan, uploads artifact
#   ④ cost       → infracost breakdown (only if changes detected)
#   ⑤ create-pr  → auto-creates PR with plan + cost + DEPLOYMENT_CONTEXT metadata
#
# ENVIRONMENT → RUNNER TAG → REGION MAPPING:
#   dev      → [self-hosted, terraform, dev]      → us-east-1
#   qa       → [self-hosted, terraform, qa]       → us-east-1
#   preprod  → [self-hosted, terraform, preprod]  → us-east-1
#   prod     → [self-hosted, terraform, prod]     → us-east-1
#   dr       → [self-hosted, terraform, dr]       → us-east-2

#----------- Integración BeyondTrust--------------------------------------------
# FLUJO VALIDADO (4 pasos):
#   1. POST /auth/connect/token          → OAuth access_token
#   2. POST /Auth/SignAppin (con cookie) → sesión activa
#   3. GET  /secrets-safe/secrets        → lista todos los secretos del vault
#              filtrar por .Title        → obtener .Id
#   4. GET  /secrets-safe/secrets/{Id}   → valor real en .Password
#      POST /Auth/Signout                → cerrar sesión
#
# AISLAMIENTO POR VAULT:
#   Cada Application User (BYT_CLIENT_ID_DEV, _QA, _PREPROD, _PROD) solo tiene
#   acceso a su vault (VaultDev, VaultQA, VaultPreprod, VaultProd).
#   El listado /secrets-safe/secrets ya está scoped al vault correcto — no hay
#   que pasar el vault ni el folder path. Solo el Title del secreto.

name: "[reusable] Terraform CI"

on:
  workflow_call:
    inputs:
      # ─── Required inputs ───────────────────────────────────────
      environment:
        description: "Target environment: dev, qa, preprod, prod, dr"
        required: true
        type: string
      working_directory:
        description: "Path to Terragrunt environment. E.g. environments/dev"
        required: true
        type: string
      account_id:
        description: "AWS account ID for the target environment."
        required: true
        type: string
      ou_name:
        description: "OU / product name — root folder in state bucket."
        required: true
        type: string

      # ─── Optional inputs ───────────────────────────────────────
      extra_vars:
        description: |
          Space-separated Terraform -var overrides injected at plan time.
          Format: "key1=value1 key2=value2"
          Example: "tgw_id=tgw-0abc1234 service=datosanalitica ambiente=dev"
        required: false
        type: string
        default: ""
        
      secret_var_names:
        description: |
          Space-separated Terraform variable NAMES whose values are sensitive.
          Values must NOT be passed here — they come from the environment-level
          GitHub Secret TERRAFORM_SENSITIVE_VARS (passed via secrets: inherit).

          Example: "entra_client_secret htpasswd_password"

          These names (not values) are embedded in DEPLOYMENT_CONTEXT for audit
          traceability. The actual injection happens in the plan job via TF_VAR_*
          env vars, masked with ::add-mask:: before the plan runs.

          Contrast with extra_vars (non-sensitive -var flags visible in PR body):
            extra_vars     → "tgw_id=tgw-0abc1234"     (non-sensitive, in PR table)
            secret_var_names → "entra_client_secret"   (names only, values in secret)
        required: false
        type: string
        default: ""
        
      create_pr:
        description: "Whether CI should auto-create a Pull Request."
        required: false
        type: boolean
        default: true
      pr_source_branch:
        description: "Source branch for the PR (e.g. feature/add-vpc or dev)."
        required: false
        type: string
        default: ""
      pr_target_branch:
        description: "Target branch for the PR (e.g. dev, testing, preprod, master)."
        required: false
        type: string
        default: ""
      pr_title:
        description: "Title for the auto-created PR."
        required: false
        type: string
        default: ""
      target_role_name:
        description: "IAM role name to assume in target account."
        required: false
        type: string
        default: "terraform-apply-role"

      # ─── Deployment context (passthrough for promotion chain) ───
      dev_account_id:
        description: "DEV account ID — passed through for promotion chain."
        required: false
        type: string
        default: ""
      qa_account_id:
        description: "QA account ID — passed through for promotion chain."
        required: false
        type: string
        default: ""
      preprod_account_id:
        description: "PREPROD account ID — empty means preprod is skipped."
        required: false
        type: string
        default: ""
      prod_account_id:
        description: "PROD account ID — passed through for promotion chain."
        required: false
        type: string
        default: ""
      dr_enabled:
        description: "Whether DR (us-east-2) is enabled for prod."
        required: false
        type: boolean
        default: false
      feature_branch:
        description: "Original feature branch (for traceability)."
        required: false
        type: string
        default: ""

    outputs:
      plan_exitcode:
        description: "0=no changes, 2=changes present."
        value: ${{ jobs.plan.outputs.exitcode }}
      plan_artifact_name:
        description: "Artifact name to pass to cd.yml."
        value: ${{ jobs.plan.outputs.artifact_name }}
      environment:
        description: "Resolved environment name."
        value: ${{ jobs.resolve.outputs.environment }}
      pr_number:
        description: "PR number if created."
        value: ${{ jobs.create-pr.outputs.pr_number }}
      pr_url:
        description: "PR URL if created."
        value: ${{ jobs.create-pr.outputs.pr_url }}

concurrency:
  group: "tf-ci-${{ inputs.environment }}-${{ inputs.ou_name }}-${{ github.event.pull_request.number || github.ref_name }}"
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  ⓪ RESOLVE
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve"
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]

    outputs:
      environment: ${{ steps.derive.outputs.environment }}
      region:      ${{ steps.derive.outputs.region }}
      bucket:      ${{ steps.derive.outputs.bucket }}
      state_key:   ${{ steps.derive.outputs.state_key }}

    steps:
      - name: Derive infrastructure context
        id: derive
        run: |
          ENV="${{ inputs.environment }}"
          REPO="${{ github.event.repository.name }}"
          OU="${{ inputs.ou_name }}"

          case "$ENV" in
            dev|qa|preprod|prod)
              REGION="us-east-1"
              BUCKET="s3-aw-ue1-terraform-state-${ENV}"
              ;;
            dr)
              REGION="us-east-2"
              BUCKET="s3-aw-ue2-terraform-state-dr"
              ;;
            *)
              echo "::error::Invalid environment: '$ENV'. Valid: dev, qa, preprod, prod, dr"
              exit 1
              ;;
          esac

          STATE_KEY="${OU}/${REPO}/terraform.tfstate"

          echo "environment=$ENV"     >> $GITHUB_OUTPUT
          echo "region=$REGION"       >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET"       >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ⓪ Resolved Context
          | Key | Value |
          |-----|-------|
          | Environment | \`${ENV}\` |
          | Region | \`${REGION}\` |
          | Bucket | \`${BUCKET}\` |
          | State key | \`${STATE_KEY}\` |
          | Account ID | \`${{ inputs.account_id }}\` |
          | Working dir | \`${{ inputs.working_directory }}\` |
          | Extra vars | \`${{ inputs.extra_vars }}\` |
          EOF

  # ─────────────────────────────────────────────
  #  ① FORMAT
  # ─────────────────────────────────────────────
  format:
    name: "① Format"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Terragrunt hclfmt
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt hclfmt --check --diff

  # ─────────────────────────────────────────────
  #  ② LINT
  # ─────────────────────────────────────────────
  lint:
    name: "② Lint"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-lint-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}
          
      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
          
      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Inject sensitive Terraform variables
        # Runs only when the caller declared sensitive var names.
        # Reads TERRAFORM_SENSITIVE_VARS (env-level GitHub Secret, passed via
        # secrets: inherit). Parses KEY=VALUE lines and exports each as TF_VAR_KEY.
        # ::add-mask:: ensures values are redacted from all subsequent log output,
        # including the plan step. Terraform additionally marks them (sensitive).
        if: inputs.secret_var_names != ''
        env:
          # TERRAFORM_SENSITIVE_VARS is an environment-level GitHub Secret.
          # Format: one KEY=VALUE pair per line. Example:
          #   entra_client_secret=abc123-secret-value
          #   htpasswd_password=MyS3cur3P@ssw0rd!
          # Values are automatically masked in logs because the env var
          # comes from a GitHub Secret.
          _TF_SENSITIVE_VARS: ${{ secrets.TERRAFORM_SENSITIVE_VARS }}
        run: |
          echo "── Injecting sensitive TF vars for: ${{ inputs.secret_var_names }} ──"

          if [ -z "$_TF_SENSITIVE_VARS" ]; then
            echo "::error::secret_var_names is set to '${{ inputs.secret_var_names }}'"
            echo "::error::but the TERRAFORM_SENSITIVE_VARS environment secret is empty or missing."
            echo "::error::Create an environment-level secret named TERRAFORM_SENSITIVE_VARS"
            echo "::error::with one KEY=VALUE pair per line for each declared variable name."
            exit 1
          fi

          COUNT=0
          while IFS= read -r line; do
            # Skip blank lines and comment lines
            [[ -z "$line" || "$line" == \#* ]] && continue

            VAR_NAME="${line%%=*}"
            VAR_VALUE="${line#*=}"

            if [ -z "$VAR_NAME" ] || [ "$VAR_NAME" = "$line" ]; then
              echo "::warning::Skipping malformed line (no '=' separator): masked"
              continue
            fi

            # Mask the value in all subsequent steps and log output
            echo "::add-mask::$VAR_VALUE"

            # Inject as TF_VAR_<name> — Terraform picks these up automatically
            printf 'TF_VAR_%s=%s\n' "$VAR_NAME" "$VAR_VALUE" >> $GITHUB_ENV

            COUNT=$((COUNT + 1))
          done <<< "$_TF_SENSITIVE_VARS"

          echo "✅ Injected ${COUNT} sensitive TF variable(s)."

          # Cross-check: warn if a declared name has no corresponding value
          for DECLARED_NAME in ${{ inputs.secret_var_names }}; do
            if ! grep -q "^${DECLARED_NAME}=" <<< "$_TF_SENSITIVE_VARS"; then
              echo "::warning::Declared sensitive var '${DECLARED_NAME}' not found in TERRAFORM_SENSITIVE_VARS."
              echo "::warning::Terraform will error if the variable is required and has no default."
            fi
          done

      - name: Run TFLint
        working-directory: ${{ inputs.working_directory }}
        run: tflint --format=compact

  # ─────────────────────────────────────────────
  #  ③ VALIDATE + PLAN
  # ─────────────────────────────────────────────
  plan:
    name: "③ Plan"
    needs: [resolve, format, lint]
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}
      
    outputs:
      exitcode:      ${{ steps.plan.outputs.exitcode }}
      artifact_name: ${{ steps.artifact_name.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-plan-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}
          
      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
          
      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Terragrunt validate
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt validate

      - name: Terragrunt plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          # Build -var flags from extra_vars input
          EXTRA_VAR_FLAGS=""
          if [ -n "${{ inputs.extra_vars }}" ]; then
            for pair in ${{ inputs.extra_vars }}; do
              EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
            done
          fi

          set +e
          eval terragrunt plan \
            $EXTRA_VAR_FLAGS \
            -out=$(pwd)/tfplan \
            -input=false \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt
          EXITCODE=${PIPESTATUS[0]}
          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT

          if [ "$EXITCODE" -eq "1" ]; then
            echo "::error::Terragrunt plan failed."
            exit 1
          fi

          # Summary
          if [ "$EXITCODE" -eq "0" ]; then
            echo "### ③ Plan: ✅ No changes" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ③ Plan: ⚠️ Changes detected" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 plan_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: Build artifact name
        id: artifact_name
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ENV="${{ inputs.environment }}"
          echo "value=tfplan-${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 5
          if-no-files-found: error

  # ─────────────────────────────────────────────
  #  ④ COST ESTIMATE
  #  Uses Infracost CLI pre-installed in runner image.
  #  INFRACOST_API_KEY injected via pod environment.
  # ─────────────────────────────────────────────
  cost:
    name: "④ Cost"
    needs: [resolve, plan]
    if: needs.plan.outputs.exitcode == '2'
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}
      
    outputs:
      monthly_cost: ${{ steps.parse.outputs.monthly_cost }}
      cost_diff:    ${{ steps.parse.outputs.cost_diff }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "infracost-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}
          
      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
          
      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ${{ inputs.working_directory }}

      - name: Convert plan to JSON
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt show -json $(pwd)/tfplan > tfplan.json

      - name: Generate Infracost estimate
        working-directory: ${{ inputs.working_directory }}
        run: |
          infracost breakdown \
            --path tfplan.json \
            --format json \
            --out-file infracost.json

      - name: Parse cost output
        id: parse
        working-directory: ${{ inputs.working_directory }}
        run: |
          MONTHLY=$(jq -r '.totalMonthlyCost // "0.00"' infracost.json)
          DIFF=$(jq -r '.diffTotalMonthlyCost // "0.00"' infracost.json 2>/dev/null || echo "0.00")
          echo "monthly_cost=$MONTHLY" >> $GITHUB_OUTPUT
          echo "cost_diff=$DIFF" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ④ Cost Estimate
          | Metric | Value |
          |--------|-------|
          | Monthly cost | \`\$${MONTHLY}/mo\` |
          | Cost diff | \`\$${DIFF}/mo\` |
          EOF

      - name: Upload cost artifact
        uses: actions/upload-artifact@v4
        with:
          name: infracost-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ inputs.working_directory }}/infracost.json
          retention-days: 5

  # ─────────────────────────────────────────────
  #  ⑤ CREATE PR
  #  Auto-creates a Pull Request with:
  #    - Plan + cost in visible body
  #    - DEPLOYMENT_CONTEXT as hidden HTML metadata
  #      (parsed by cd-on-merge.yml after merge)
  # ─────────────────────────────────────────────
  create-pr:
    name: "⑤ Create PR"
    needs: [resolve, plan, cost]
    if: |
      always() &&
      inputs.create_pr &&
      inputs.pr_source_branch != '' &&
      inputs.pr_target_branch != '' &&
      needs.plan.result == 'success'
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url:    ${{ steps.pr.outputs.pr_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch }}
          fetch-depth: 0

      - name: Download plan output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: /tmp/plan-artifacts

      - name: Create or update Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SOURCE="${{ inputs.pr_source_branch }}"
          TARGET="${{ inputs.pr_target_branch }}"
          ENV="${{ inputs.environment }}"
          EXITCODE="${{ needs.plan.outputs.exitcode }}"
          BUCKET="${{ needs.resolve.outputs.bucket }}"
          STATE_KEY="${{ needs.resolve.outputs.state_key }}"
          REGION="${{ needs.resolve.outputs.region }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MONTHLY_COST="${{ needs.cost.outputs.monthly_cost }}"
          COST_DIFF="${{ needs.cost.outputs.cost_diff }}"

          # Default cost values if cost job was skipped (no changes)
          if [ -z "$MONTHLY_COST" ]; then MONTHLY_COST="N/A"; fi
          if [ -z "$COST_DIFF" ]; then COST_DIFF="N/A"; fi

          # Determine change status
          if [ "$EXITCODE" = "0" ]; then
            STATUS_ICON="✅ No changes"
            STATUS_MSG="> ℹ️ No infrastructure changes. Apply will be skipped in CD."
          else
            STATUS_ICON="⚠️ Changes detected"
            STATUS_MSG="> ⚡ Plan saved. CD applies this **exact plan** after merge — no re-plan."
          fi

          # Read plan output (truncate if too large)
          PLAN_OUTPUT="Plan output not available."
          if [ -f /tmp/plan-artifacts/plan_output.txt ]; then
            PLAN_RAW=$(cat /tmp/plan-artifacts/plan_output.txt)
            if [ ${#PLAN_RAW} -gt 60000 ]; then
              PLAN_OUTPUT="${PLAN_RAW:0:60000}

          ⚠️ Output truncated — see Actions for full log."
            else
              PLAN_OUTPUT="$PLAN_RAW"
            fi
          fi

          # Build PR title
          PR_TITLE="${{ inputs.pr_title }}"
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="🚀 [${ENV^^}] Deploy infrastructure — ${SHORT_SHA}"
          fi

          # Determine next environment for metadata
          case "$ENV" in
            dev)     NEXT_ENV="qa" ;;
            qa)
              if [ -n "${{ inputs.preprod_account_id }}" ]; then
                NEXT_ENV="preprod"
              else
                NEXT_ENV="prod"
              fi
              ;;
            preprod) NEXT_ENV="prod" ;;
            prod)    NEXT_ENV="" ;;
            *)       NEXT_ENV="" ;;
          esac

          # Determine approval teams for next transition
          case "$ENV" in
            dev)     NEXT_APPROVAL_TEAMS="Desarrollo" ;;
            qa)      NEXT_APPROVAL_TEAMS="CloudOps,Seguridad" ;;
            preprod) NEXT_APPROVAL_TEAMS="CloudOps,Infraestructura" ;;
            prod)    NEXT_APPROVAL_TEAMS="" ;;
            *)       NEXT_APPROVAL_TEAMS="" ;;
          esac

          # Build PR body with visible content + hidden metadata
          PR_BODY="## 🔍 Terraform Plan — \`${ENV}\` ${STATUS_ICON}

          | Field | Value |
          |-------|-------|
          | **Environment** | \`${ENV}\` |
          | **Region** | \`${REGION}\` |
          | **Account ID** | \`${{ inputs.account_id }}\` |
          | **Directory** | \`${{ inputs.working_directory }}\` |
          | **State bucket** | \`${BUCKET}\` |
          | **State key** | \`${STATE_KEY}\` |
          | **Extra vars** | \`${{ inputs.extra_vars }}\` |
          | **Commit** | \`${SHORT_SHA}\` |
          | **Cost (monthly)** | \`\$${MONTHLY_COST}/mo\` |
          | **Cost (diff)** | \`\$${COST_DIFF}/mo\` |
          | **Triggered by** | @${{ github.actor }} |

          ${STATUS_MSG}

          <details><summary>📋 Plan output (expand)</summary>

          \`\`\`hcl
          ${PLAN_OUTPUT}
          \`\`\`

          </details>

          ---
          > 🤖 This PR was auto-created by the CI pipeline. Review the plan above and approve to deploy.

          <!-- DEPLOYMENT_CONTEXT
          environment: ${ENV}
          account_id: ${{ inputs.account_id }}
          ou_name: ${{ inputs.ou_name }}
          working_directory: ${{ inputs.working_directory }}
          extra_vars: ${{ inputs.extra_vars }}
          secret_var_names: ${{ inputs.secret_var_names }}
          plan_artifact_name: ${{ needs.plan.outputs.artifact_name }}
          plan_exitcode: ${EXITCODE}
          next_environment: ${NEXT_ENV}
          approval_teams: ${NEXT_APPROVAL_TEAMS}
          dev_account_id: ${{ inputs.dev_account_id }}
          qa_account_id: ${{ inputs.qa_account_id }}
          preprod_account_id: ${{ inputs.preprod_account_id }}
          prod_account_id: ${{ inputs.prod_account_id }}
          dr_enabled: ${{ inputs.dr_enabled }}
          feature_branch: ${{ inputs.feature_branch }}
          source_branch: ${SOURCE}
          target_branch: ${TARGET}
          region: ${REGION}
          commit_sha: ${{ github.sha }}
          ci_run_id: ${{ github.run_id }}
          monthly_cost: ${MONTHLY_COST}
          cost_diff: ${COST_DIFF}
          -->"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list \
            --head "$SOURCE" \
            --base "$TARGET" \
            --state open \
            --json number,url \
            --jq '.[0]' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            # Update existing PR
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
            gh pr edit "$PR_NUMBER" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            echo "Updated existing PR #${PR_NUMBER}"
          else
            # Create new PR
            PR_URL=$(gh pr create \
              --head "$SOURCE" \
              --base "$TARGET" \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
            
            # Add labels (non-fatal if they don't exist)
            gh pr edit "$PR_NUMBER" --add-label "environment/${ENV}" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "terraform" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "needs-review" 2>/dev/null || true

            echo "Created new PR #${PR_NUMBER}"
          fi

          # Add production label if prod/dr
          if [ "$ENV" = "prod" ] || [ "$ENV" = "dr" ]; then
            gh pr edit "$PR_NUMBER" --add-label "production" 2>/dev/null || true
          fi

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      - name: PR Summary
        if: steps.pr.outputs.pr_number != ''
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ⑤ Pull Request
          | Field | Value |
          |-------|-------|
          | PR | [#${{ steps.pr.outputs.pr_number }}](${{ steps.pr.outputs.pr_url }}) |
          | Source | \`${{ inputs.pr_source_branch }}\` |
          | Target | \`${{ inputs.pr_target_branch }}\` |
          | Environment | \`${{ inputs.environment }}\` |
          | Context metadata | ✅ Embedded |
          EOF
