# ORG-DEVOPS/.github/workflows/ci.yml
#
# Reusable CI workflow — ADR-009: terragrunt run-all simplification
#
# AUTO-DETECTS multi-component directories:
#   - If working_directory contains subdirectories with terragrunt.hcl → run-all plan
#   - If working_directory is a single component → terragrunt plan (legacy behavior)
#
# This replaces the ADR-008 split pattern (ci-validate + ci-plan + ci-create-pr)
# with a single workflow call. Terragrunt resolves dependencies internally.
#
# JOBS:
#   ⓪ resolve    → derives bucket, state key, region
#   ① format     → terragrunt hclfmt --check
#   ② lint       → tflint governance rules
#   ③ plan       → terragrunt [run-all] plan + upload artifact
#   ④ cost       → infracost breakdown (if changes detected)
#   ⑤ security   → Prowler IaC scan
#   ⑤b sast      → Checkmarx SAST/SCA (conditional)
#   ⑥ create-pr  → auto-creates PR with plan + DEPLOYMENT_CONTEXT

name: "[reusable] Terraform CI"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: dev, qa, preprod, prod, dr"
        required: true
        type: string
      working_directory:
        description: "Path to Terragrunt environment. E.g. environments/dev"
        required: true
        type: string
      account_id:
        description: "AWS account ID for the target environment."
        required: true
        type: string
      ou_name:
        description: "OU / product name — root folder in state bucket."
        required: true
        type: string


      # ─── Runner override ─────────────────────────────────────────
      runner_label:
        description: "Override the runner tag. Default: uses environment value."
        required: false
        type: string
        default: ""

      # ─── Optional inputs ───────────────────────────────────────
      extra_vars:
        description: "Space-separated Terraform -var overrides. Format: 'key1=value1 key2=value2'"
        required: false
        type: string
        default: ""
      checkmarx_scan:
        description: "Run Checkmarx SAST/SCA scan. Default: true (auto-detect)."
        required: false
        type: boolean
        default: true
      security_scan:
        description: "Run Prowler IaC security scan. Default: true."
        required: false
        type: boolean
        default: true
      fail_on_high_critical:
        description: "Fail on CRITICAL/HIGH findings. Default: true."
        required: false
        type: boolean
        default: true
      secret_titles:
        description: |
          JSON array of secrets to retrieve from BeyondTrust and inject as TF_VAR_*.
          Format: '[{"title": "secret-name", "tf_var": "variable_name"}]'
        required: false
        type: string
        default: ""
      create_pr:
        description: "Whether CI should auto-create a Pull Request."
        required: false
        type: boolean
        default: true
      pr_source_branch:
        description: "Source branch for the PR."
        required: false
        type: string
        default: ""
      pr_target_branch:
        description: "Target branch for the PR."
        required: false
        type: string
        default: ""
      pr_title:
        description: "Title for the auto-created PR."
        required: false
        type: string
        default: ""
      target_role_name:
        description: "IAM role name to assume in target account."
        required: false
        type: string
        default: "terraform-apply-role"


      # ─── Port.io log streaming ────────────────────────────────
      port_run_id:
        description: "Port.io action run ID for log streaming. If empty, logs are skipped."
        required: false
        type: string
        default: ""
      port_client_id:
        description: "Port.io client ID (pass from vars.PORT_CLIENT_ID of the calling repo)."
        required: false
        type: string
        default: ""
      port_base_url:
        description: "Port.io API base URL (pass from vars.PORT_API_BASE_URL of the calling repo)."
        required: false
        type: string
        default: "https://api.us.getport.io"

      # ─── Deployment context (passthrough for promotion chain) ───
      dev_account_id:
        description: "DEV account ID."
        required: false
        type: string
        default: ""
      qa_account_id:
        description: "QA account ID."
        required: false
        type: string
        default: ""
      preprod_account_id:
        description: "PREPROD account ID — empty means preprod is skipped."
        required: false
        type: string
        default: ""
      prod_account_id:
        description: "PROD account ID."
        required: false
        type: string
        default: ""
      dr_enabled:
        description: "Whether DR is enabled for prod."
        required: false
        type: boolean
        default: false
      feature_branch:
        description: "Original feature branch (for traceability)."
        required: false
        type: string
        default: ""

    outputs:
      plan_exitcode:
        description: "0=no changes, 2=changes present."
        value: ${{ jobs.plan.outputs.exitcode }}
      plan_artifact_name:
        description: "Artifact name to pass to cd.yml."
        value: ${{ jobs.plan.outputs.artifact_name }}
      environment:
        description: "Resolved environment name."
        value: ${{ jobs.resolve.outputs.environment }}
      is_multi_component:
        description: "Whether run-all mode was used."
        value: ${{ jobs.resolve.outputs.is_multi_component }}
      pr_number:
        description: "PR number if created."
        value: ${{ jobs.create-pr.outputs.pr_number }}
      pr_url:
        description: "PR URL if created."
        value: ${{ jobs.create-pr.outputs.pr_url }}

concurrency:
  group: "tf-ci-${{ inputs.environment }}-${{ inputs.ou_name }}-${{ github.event.pull_request.number || github.ref_name }}"
  cancel-in-progress: true


jobs:
  # ─────────────────────────────────────────────
  #  ⓪ RESOLVE — detect single vs multi-component
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve"
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    outputs:
      environment:        ${{ steps.derive.outputs.environment }}
      region:             ${{ steps.derive.outputs.region }}
      bucket:             ${{ steps.derive.outputs.bucket }}
      state_key:          ${{ steps.derive.outputs.state_key }}
      is_multi_component: ${{ steps.detect.outputs.is_multi_component }}

    steps:
      # ─── Port.io log: CI started ───
      - name: Log to Port — CI started
        if: inputs.port_run_id != ''
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')
          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"CI iniciado: environment=${{ inputs.environment }}, account=${{ inputs.account_id }}\"}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Derive infrastructure context
        id: derive
        run: |
          ENV="${{ inputs.environment }}"
          REPO="${{ github.event.repository.name }}"
          OU="${{ inputs.ou_name }}"

          case "$ENV" in
            dev|qa|preprod|prod)
              REGION="us-east-1"
              BUCKET="s3-aw-ue1-terraform-state-${ENV}"
              ;;
            dr)
              REGION="us-east-2"
              BUCKET="s3-aw-ue2-terraform-state-dr"
              ;;
            *)
              echo "::error::Invalid environment: '$ENV'."
              exit 1
              ;;
          esac

          STATE_KEY="${OU}/${REPO}/terraform.tfstate"

          echo "environment=$ENV"     >> $GITHUB_OUTPUT
          echo "region=$REGION"       >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET"       >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT


      - name: Detect multi-component directory
        id: detect
        run: |
          WORK_DIR="${{ inputs.working_directory }}"
          if find "$WORK_DIR" -mindepth 2 -name "terragrunt.hcl" 2>/dev/null | grep -q .; then
            echo "is_multi_component=true" >> $GITHUB_OUTPUT
            echo "Detected MULTI-COMPONENT directory (run-all mode)."
            echo "Components found:"
            for dir in "$WORK_DIR"/*/; do
              if [ -f "${dir}terragrunt.hcl" ]; then
                echo "  - $(basename $dir)"
              fi
            done
          else
            echo "is_multi_component=false" >> $GITHUB_OUTPUT
            echo "Detected SINGLE-COMPONENT directory (standard mode)."
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ⓪ Resolved Context
          | Key | Value |
          |-----|-------|
          | Environment | \`${{ inputs.environment }}\` |
          | Working dir | \`${WORK_DIR}\` |
          | Multi-component | \`$([ -n "$(find "$WORK_DIR" -mindepth 2 -name "terragrunt.hcl" 2>/dev/null)" ] && echo "true" || echo "false")\` |
          | Account ID | \`${{ inputs.account_id }}\` |
          EOF


  # ─────────────────────────────────────────────
  #  ① FORMAT
  # ─────────────────────────────────────────────
  format:
    name: "① Format"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Terragrunt hclfmt
        run: terragrunt hclfmt --check --diff

  # ─────────────────────────────────────────────
  #  ② LINT + GOVERNANCE
  # ─────────────────────────────────────────────
  lint:
    name: "② Lint"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Checkout orchestrator (governance files)
        uses: actions/checkout@v4
        with:
          repository: bin-transversales-devops/platform-orchestrator-automation-terraform
          ref: master
          path: .orchestrator
          token: ${{ secrets.GH_TOKEN }}

      - name: Copy governance files
        run: |
          if [ ! -f ".tflint.hcl" ]; then
            cp .orchestrator/.tflint.hcl .tflint.hcl
            echo "Copied .tflint.hcl from orchestrator"
          fi
          mkdir -p scripts
          cp .orchestrator/scripts/naming_pattern_validator.sh scripts/
          chmod +x scripts/naming_pattern_validator.sh


      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-lint-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}

      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}

      - name: Run TFLint on all components
        run: |
          echo "── Running TFLint with enterprise governance rules ──"
          FAILED=0
          WORK_DIR="${{ inputs.working_directory }}"

          if [ "${{ needs.resolve.outputs.is_multi_component }}" = "true" ]; then
            # Multi-component: lint each subdirectory
            for dir in ${WORK_DIR}/*/; do
              if [ -f "${dir}terragrunt.hcl" ]; then
                echo "── Linting: ${dir} ──"
                cd "${dir}"
                terragrunt init -reconfigure 2>/dev/null || true
                tflint --format=compact || FAILED=1
                cd "${{ github.workspace }}"
              fi
            done
          else
            # Single component: lint the working directory
            cd "${WORK_DIR}"
            terragrunt init -reconfigure 2>/dev/null || true
            tflint --format=compact || FAILED=1
            cd "${{ github.workspace }}"
          fi

          if [ "$FAILED" = "1" ]; then
            echo "::error::TFLint failed for one or more components."
            exit 1
          fi
          echo "TFLint passed."
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"


  # ─────────────────────────────────────────────
  #  ③ PLAN — auto-detects run-all vs single
  # ─────────────────────────────────────────────
  plan:
    name: "③ Plan"
    needs: [resolve, format, lint]
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      TF_VAR_aws_account_id: ${{ inputs.account_id }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}

    outputs:
      exitcode:      ${{ steps.plan.outputs.exitcode }}
      artifact_name: ${{ steps.artifact_name.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-plan-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}

      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}


      - name: Retrieve secrets from BeyondTrust Secrets Safe
        if: inputs.secret_titles != ''
        env:
          _BT_URL: ${{ vars.BT_URL }}
          _BYT_CLIENT_ID_DEV:         ${{ secrets.BYT_CLIENT_ID_DEV }}
          _BYT_CLIENT_SECRET_DEV:     ${{ secrets.BYT_CLIENT_SECRET_DEV }}
          _BYT_CLIENT_ID_QA:          ${{ secrets.BYT_CLIENT_ID_QA }}
          _BYT_CLIENT_SECRET_QA:      ${{ secrets.BYT_CLIENT_SECRET_QA }}
          _BYT_CLIENT_ID_PREPROD:     ${{ secrets.BYT_CLIENT_ID_PREPROD }}
          _BYT_CLIENT_SECRET_PREPROD: ${{ secrets.BYT_CLIENT_SECRET_PREPROD }}
          _BYT_CLIENT_ID_PROD:        ${{ secrets.BYT_CLIENT_ID_PROD }}
          _BYT_CLIENT_SECRET_PROD:    ${{ secrets.BYT_CLIENT_SECRET_PROD }}
          _SECRET_TITLES: ${{ inputs.secret_titles }}
        run: |
          echo "── Retrieving secrets from BeyondTrust Secrets Safe ──"

          ENV="${{ inputs.environment }}"
          case "$ENV" in
            dr)      ENV_KEY="PROD" ;;
            dev)     ENV_KEY="DEV" ;;
            qa)      ENV_KEY="QA" ;;
            preprod) ENV_KEY="PREPROD" ;;
            prod)    ENV_KEY="PROD" ;;
            *)
              echo "::error::Unknown environment '${ENV}'."
              exit 1
              ;;
          esac

          ID_VAR="_BYT_CLIENT_ID_${ENV_KEY}"
          SECRET_VAR="_BYT_CLIENT_SECRET_${ENV_KEY}"
          BT_CLIENT_ID="${!ID_VAR}"
          BT_CLIENT_SECRET="${!SECRET_VAR}"

          if [ -z "$BT_CLIENT_ID" ] || [ -z "$BT_CLIENT_SECRET" ]; then
            echo "::error::BeyondTrust credentials not found for env '${ENV}' (key: ${ENV_KEY})."
            exit 1
          fi

          if [ -z "$_BT_URL" ]; then
            echo "::error::BT_URL variable is not set."
            exit 1
          fi


          # OAuth token
          TOKEN=$(curl -s -f -X POST "${_BT_URL}/auth/connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${BT_CLIENT_ID}&client_secret=${BT_CLIENT_SECRET}" \
            | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::BeyondTrust did not return access_token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          # SignAppin
          BT_COOKIE=$(mktemp /tmp/bt_session_XXXXXX.txt)
          SIGNIN_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -c "$BT_COOKIE" \
            -X POST "${_BT_URL}/Auth/SignAppin" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "")

          if [ "$SIGNIN_HTTP" != "200" ]; then
            echo "::error::BeyondTrust SignAppin failed (HTTP ${SIGNIN_HTTP})."
            rm -f "$BT_COOKIE"
            exit 1
          fi

          # List secrets
          ALL_SECRETS=$(curl -s -f -b "$BT_COOKIE" \
            -H "Authorization: Bearer $TOKEN" \
            "${_BT_URL}/secrets-safe/secrets")

          # Fetch each secret by title and inject as TF_VAR_*
          echo "$_SECRET_TITLES" | jq -c '.[]' | while IFS= read -r entry; do
            TITLE=$(echo "$entry"  | jq -r '.title')
            TF_VAR=$(echo "$entry" | jq -r '.tf_var')

            SECRET_ID=$(echo "$ALL_SECRETS" | jq -r \
              --arg t "$TITLE" '.[] | select(.Title == $t) | .Id' | head -1)

            if [ -z "$SECRET_ID" ]; then
              echo "::error::Secret '${TITLE}' not found in vault for env '${ENV}'."
              curl -s -b "$BT_COOKIE" -X POST "${_BT_URL}/Auth/Signout" \
                -H "Authorization: Bearer $TOKEN" > /dev/null 2>&1 || true
              rm -f "$BT_COOKIE"
              exit 1
            fi

            SECRET_VALUE=$(curl -s -f -b "$BT_COOKIE" \
              -H "Authorization: Bearer $TOKEN" \
              "${_BT_URL}/secrets-safe/secrets/${SECRET_ID}" \
              | jq -r '.Password // empty')

            if [ -z "$SECRET_VALUE" ]; then
              echo "::error::Secret '${TITLE}' (id: ${SECRET_ID}) returned empty."
              curl -s -b "$BT_COOKIE" -X POST "${_BT_URL}/Auth/Signout" \
                -H "Authorization: Bearer $TOKEN" > /dev/null 2>&1 || true
              rm -f "$BT_COOKIE"
              exit 1
            fi

            echo "::add-mask::$SECRET_VALUE"
            printf 'TF_VAR_%s=%s\n' "$TF_VAR" "$SECRET_VALUE" >> $GITHUB_ENV
            echo "TF_VAR_${TF_VAR} injected (title: ${TITLE})"
          done

          # Signout
          curl -s -b "$BT_COOKIE" -X POST "${_BT_URL}/Auth/Signout" \
            -H "Authorization: Bearer $TOKEN" > /dev/null 2>&1 || true
          rm -f "$BT_COOKIE"
          echo "── BeyondTrust session closed. ──"

      # ─── Port.io log: plan starting ───
      - name: Log to Port — Executing plan
        if: inputs.port_run_id != ''
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')
          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"message": "Ejecutando terraform plan en ${{ inputs.environment }}..."}'

      - name: Terragrunt plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
          TF_CLI_ARGS: "-no-color"
          TERRAGRUNT_NO_COLOR: "true"
        run: |
          # Build -var flags from extra_vars
          EXTRA_VAR_FLAGS=""
          if [ -n "${{ inputs.extra_vars }}" ]; then
            for pair in ${{ inputs.extra_vars }}; do
              EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
            done
          fi

          IS_MULTI="${{ needs.resolve.outputs.is_multi_component }}"
          PLAN_OUT_DIR="$(pwd)/plans"
          mkdir -p "$PLAN_OUT_DIR"

          set +e
          if [ "$IS_MULTI" = "true" ]; then
            # ── MULTI-COMPONENT: terragrunt run-all plan ──
            echo "══════════════════════════════════════════════"
            echo "  MODE: terragrunt run-all plan"
            echo "  Terragrunt resolves dependencies internally"
            echo "══════════════════════════════════════════════"
            eval terragrunt run-all plan \
              $EXTRA_VAR_FLAGS \
              --terragrunt-non-interactive \
              --terragrunt-out-dir "$PLAN_OUT_DIR" \
              -input=false \
              -detailed-exitcode \
              2>&1 | tee plan_output.txt
            EXITCODE=${PIPESTATUS[0]}
          else
            # ── SINGLE-COMPONENT: standard terragrunt plan ──
            echo "══════════════════════════════════════════════"
            echo "  MODE: terragrunt plan (single component)"
            echo "══════════════════════════════════════════════"
            eval terragrunt plan \
              $EXTRA_VAR_FLAGS \
              -out="$PLAN_OUT_DIR/tfplan" \
              -input=false \
              -detailed-exitcode \
              2>&1 | tee plan_output.txt
            EXITCODE=${PIPESTATUS[0]}
          fi
          set -e

          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT

          if [ "$EXITCODE" -eq "1" ]; then
            echo "::error::Terragrunt plan failed."
            exit 1
          fi

          # Summary
          if [ "$EXITCODE" -eq "0" ]; then
            echo "### ③ Plan: No changes" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ③ Plan: Changes detected" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 plan_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit 0


      - name: Build artifact name
        id: artifact_name
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ENV="${{ inputs.environment }}"
          echo "value=tfplan-${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: |
            ${{ inputs.working_directory }}/plans/
            ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 14
          if-no-files-found: error

  # ─────────────────────────────────────────────
  #  ④ COST ESTIMATE
  # ─────────────────────────────────────────────
  cost:
    name: "④ Cost"
    needs: [resolve, plan]
    if: needs.plan.outputs.exitcode == '2'
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}

    outputs:
      monthly_cost: ${{ steps.parse.outputs.monthly_cost }}
      cost_diff:    ${{ steps.parse.outputs.cost_diff }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "infracost-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}

      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}


      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ${{ inputs.working_directory }}

      - name: Generate Infracost estimate
        working-directory: ${{ inputs.working_directory }}
        run: |
          IS_MULTI="${{ needs.resolve.outputs.is_multi_component }}"
          TOTAL_MONTHLY="0"
          TOTAL_DIFF="0"

          if [ "$IS_MULTI" = "true" ]; then
            # Multi-component: estimate each plan
            for plan_dir in plans/*/; do
              if [ -f "${plan_dir}tfplan" ]; then
                COMPONENT=$(basename "$plan_dir")
                cd "$COMPONENT"
                terragrunt init -reconfigure 2>/dev/null || true
                terragrunt show -json "../${plan_dir}tfplan" > tfplan.json 2>/dev/null || true
                if [ -f "tfplan.json" ]; then
                  infracost breakdown --path tfplan.json --format json --out-file infracost.json 2>/dev/null || true
                  if [ -f "infracost.json" ]; then
                    M=$(jq -r '.totalMonthlyCost // "0"' infracost.json)
                    D=$(jq -r '.diffTotalMonthlyCost // "0"' infracost.json 2>/dev/null || echo "0")
                    TOTAL_MONTHLY=$(echo "$TOTAL_MONTHLY + $M" | bc 2>/dev/null || echo "$TOTAL_MONTHLY")
                    TOTAL_DIFF=$(echo "$TOTAL_DIFF + $D" | bc 2>/dev/null || echo "$TOTAL_DIFF")
                  fi
                fi
                cd ..
              fi
            done
          else
            # Single component
            terragrunt init -reconfigure 2>/dev/null || true
            terragrunt show -json plans/tfplan > tfplan.json 2>/dev/null || true
            if [ -f "tfplan.json" ]; then
              infracost breakdown --path tfplan.json --format json --out-file infracost.json 2>/dev/null || true
              if [ -f "infracost.json" ]; then
                TOTAL_MONTHLY=$(jq -r '.totalMonthlyCost // "0"' infracost.json)
                TOTAL_DIFF=$(jq -r '.diffTotalMonthlyCost // "0"' infracost.json 2>/dev/null || echo "0")
              fi
            fi
          fi

          echo "$TOTAL_MONTHLY" > /tmp/monthly_cost.txt
          echo "$TOTAL_DIFF" > /tmp/cost_diff.txt
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"

      - name: Parse cost output
        id: parse
        run: |
          MONTHLY=$(cat /tmp/monthly_cost.txt 2>/dev/null || echo "0.00")
          DIFF=$(cat /tmp/cost_diff.txt 2>/dev/null || echo "0.00")
          echo "monthly_cost=$MONTHLY" >> $GITHUB_OUTPUT
          echo "cost_diff=$DIFF" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ④ Cost Estimate
          | Metric | Value |
          |--------|-------|
          | Monthly cost | \`\$${MONTHLY}/mo\` |
          | Cost diff | \`\$${DIFF}/mo\` |
          EOF


  # ─────────────────────────────────────────────
  #  ⑤ SECURITY — Prowler IaC
  # ─────────────────────────────────────────────
  security:
    name: "⑤ Security"
    needs: [resolve, plan]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      inputs.security_scan
    runs-on: ubuntu-latest

    outputs:
      scan_executed:   ${{ steps.scan_result.outputs.scan_executed }}
      total_critical:  ${{ steps.evaluate.outputs.total_critical }}
      total_high:      ${{ steps.evaluate.outputs.total_high }}
      prowler_summary: ${{ steps.build_summary.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prowler + Trivy
        run: |
          pip install prowler --quiet
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Prowler IaC scan
        id: prowler_scan
        continue-on-error: true
        run: |
          mkdir -p /tmp/prowler-results
          set +e
          prowler iac \
            --scan-path . \
            --output-formats json-ocsf \
            --output-directory /tmp/prowler-results \
            --no-color \
            --verbose 2>&1 | tee /tmp/prowler-output.txt
          set -e

      - name: Evaluate scan results
        id: evaluate
        run: |
          PROWLER_OUTPUT="/tmp/prowler-output.txt"
          TOTAL_CRIT=0
          TOTAL_HIGH=0

          if [ -f "$PROWLER_OUTPUT" ]; then
            CLEAN_OUTPUT=$(sed 's/\x1b\[[0-9;]*m//g' "$PROWLER_OUTPUT")
            FAIL_LINE=$(echo "$CLEAN_OUTPUT" | grep "FAIL (" | grep -v "FAIL AWS\|FAIL AZU\|FAIL GCP" | tail -1 || true)
            if [ -n "$FAIL_LINE" ]; then
              AFTER_FAIL=$(echo "$FAIL_LINE" | sed 's/.*FAIL ([0-9]*)//')
              readarray -t NUMS < <(echo "$AFTER_FAIL" | grep -oE '[0-9]+')
              if [ ${#NUMS[@]} -ge 2 ]; then
                TOTAL_CRIT=${NUMS[0]}
                TOTAL_HIGH=${NUMS[1]}
              fi
            fi
          fi

          echo "total_critical=$TOTAL_CRIT" >> $GITHUB_OUTPUT
          echo "total_high=$TOTAL_HIGH" >> $GITHUB_OUTPUT

      - name: Build summary for PR
        id: build_summary
        run: |
          CRIT="${{ steps.evaluate.outputs.total_critical }}"
          HIGH="${{ steps.evaluate.outputs.total_high }}"
          if [ "$CRIT" = "0" ] && [ "$HIGH" = "0" ]; then
            echo "summary=Security (Prowler IaC): No misconfigurations" >> $GITHUB_OUTPUT
          else
            echo "summary=Security (Prowler IaC): $CRIT Critical, $HIGH High" >> $GITHUB_OUTPUT
          fi

      - name: Mark scan executed
        id: scan_result
        run: echo "scan_executed=true" >> $GITHUB_OUTPUT

      - name: Enforce security gate
        if: inputs.fail_on_high_critical
        run: |
          TOTAL_CRIT="${{ steps.evaluate.outputs.total_critical }}"
          TOTAL_HIGH="${{ steps.evaluate.outputs.total_high }}"
          if [ "$TOTAL_CRIT" -gt 0 ] || [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "::error::Security gate FAILED: $TOTAL_CRIT CRITICAL + $TOTAL_HIGH HIGH."
            exit 1
          fi


  # ─────────────────────────────────────────────
  #  ⑤b SAST — Checkmarx (conditional)
  # ─────────────────────────────────────────────
  sast:
    name: "⑤b SAST"
    needs: [resolve, plan]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      inputs.checkmarx_scan
    runs-on: ubuntu-latest

    outputs:
      sast_summary: ${{ steps.build_summary.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Detect application code
        id: detect
        run: |
          HAS_CODE="false"
          for dir in src app lambda functions scripts/app lib pkg cmd handlers controllers; do
            if [ -d "$dir" ]; then
              HAS_CODE="true"
              break
            fi
          done
          if [ "$HAS_CODE" = "false" ]; then
            for pattern in "*.py" "*.js" "*.ts" "*.go" "*.java" "*.cs" "*.rb"; do
              if find . -maxdepth 3 -name "$pattern" \
                -not -path "./.terraform/*" \
                -not -path "./vendor/*" \
                -not -path "./node_modules/*" | grep -q .; then
                HAS_CODE="true"
                break
              fi
            done
          fi
          echo "has_app_code=$HAS_CODE" >> $GITHUB_OUTPUT

      - name: Run Checkmarx SAST/SCA
        id: cxscan
        if: steps.detect.outputs.has_app_code == 'true'
        continue-on-error: true
        uses: checkmarx/ast-github-action@main
        with:
          cx_tenant: ${{ secrets.CX_TENANT }}
          base_uri: ${{ vars.CX_BASE_URI || 'https://us.ast.checkmarx.net/' }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          project_name: ${{ github.repository }}-app
          branch: ${{ inputs.pr_source_branch || github.ref_name }}
          scan_params: >-
            --scan-types sast,sca
            --report-format json
            --output-path .

      - name: Evaluate and enforce
        id: evaluate
        if: steps.detect.outputs.has_app_code == 'true'
        run: |
          if [ ! -f "cx_result.json" ]; then
            echo "total_critical=0" >> $GITHUB_OUTPUT
            echo "total_high=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          CRIT=$(jq '[(.results // [])[] | select(.severity=="CRITICAL")] | length' cx_result.json)
          HIGH=$(jq '[(.results // [])[] | select(.severity=="HIGH")] | length' cx_result.json)
          echo "total_critical=$CRIT" >> $GITHUB_OUTPUT
          echo "total_high=$HIGH" >> $GITHUB_OUTPUT
          if [ "${{ inputs.fail_on_high_critical }}" = "true" ]; then
            if [ "$CRIT" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "::error::SAST gate FAILED: $CRIT CRITICAL + $HIGH HIGH."
              exit 1
            fi
          fi

      - name: Build summary
        id: build_summary
        run: |
          if [ "${{ steps.detect.outputs.has_app_code }}" != "true" ]; then
            echo "summary=SAST: Skipped (IaC-only)" >> $GITHUB_OUTPUT
          else
            CRIT="${{ steps.evaluate.outputs.total_critical || '0' }}"
            HIGH="${{ steps.evaluate.outputs.total_high || '0' }}"
            if [ "$CRIT" = "0" ] && [ "$HIGH" = "0" ]; then
              echo "summary=SAST (Checkmarx): Clean" >> $GITHUB_OUTPUT
            else
              echo "summary=SAST (Checkmarx): $CRIT Critical, $HIGH High" >> $GITHUB_OUTPUT
            fi
          fi


  # ─────────────────────────────────────────────
  #  ⑥ CREATE PR
  # ─────────────────────────────────────────────
  create-pr:
    name: "⑥ Create PR"
    needs: [resolve, plan, cost, security, sast]
    if: |
      always() &&
      inputs.create_pr &&
      inputs.pr_source_branch != '' &&
      inputs.pr_target_branch != '' &&
      needs.plan.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped')
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url:    ${{ steps.pr.outputs.pr_url }}

    steps:
      # ─── Port.io log: plan completed ───
      - name: Log to Port — Plan result
        if: inputs.port_run_id != ''
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')

          EXITCODE="${{ needs.plan.outputs.exitcode }}"
          if [ "$EXITCODE" = "0" ]; then
            MSG="Plan completado: Sin cambios de infraestructura."
          else
            MSG="Plan completado: Cambios detectados. Creando PR..."
          fi

          COST="${{ needs.cost.outputs.monthly_cost }}"
          if [ -n "$COST" ] && [ "$COST" != "N/A" ]; then
            MSG="${MSG} Costo estimado: \$${COST}/mo"
          fi

          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"${MSG}\"}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch }}
          fetch-depth: 0

      - name: Download plan output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: /tmp/plan-artifacts

      - name: Create or update Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SOURCE="${{ inputs.pr_source_branch }}"
          TARGET="${{ inputs.pr_target_branch }}"
          ENV="${{ inputs.environment }}"
          EXITCODE="${{ needs.plan.outputs.exitcode }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MONTHLY_COST="${{ needs.cost.outputs.monthly_cost }}"
          COST_DIFF="${{ needs.cost.outputs.cost_diff }}"
          SECURITY_SUMMARY="${{ needs.security.outputs.prowler_summary }}"
          SAST_SUMMARY="${{ needs.sast.outputs.sast_summary }}"
          IS_MULTI="${{ needs.resolve.outputs.is_multi_component }}"

          if [ -z "$MONTHLY_COST" ]; then MONTHLY_COST="N/A"; fi
          if [ -z "$COST_DIFF" ]; then COST_DIFF="N/A"; fi
          if [ -z "$SECURITY_SUMMARY" ]; then SECURITY_SUMMARY="Skipped"; fi
          if [ -z "$SAST_SUMMARY" ]; then SAST_SUMMARY="Skipped"; fi


          # Determine change status
          if [ "$EXITCODE" = "0" ]; then
            STATUS_ICON="No changes"
            STATUS_MSG="> No infrastructure changes. Apply will be skipped."
          else
            STATUS_ICON="Changes detected"
            STATUS_MSG="> Plan saved. CD applies this exact plan after merge."
          fi

          # Mode display
          if [ "$IS_MULTI" = "true" ]; then
            MODE_INFO="run-all (multi-component)"
          else
            MODE_INFO="single component"
          fi

          # Read plan output
          PLAN_OUTPUT="Plan output not available."
          if [ -f /tmp/plan-artifacts/plan_output.txt ]; then
            PLAN_RAW=$(cat /tmp/plan-artifacts/plan_output.txt)
            if [ ${#PLAN_RAW} -gt 60000 ]; then
              PLAN_OUTPUT="${PLAN_RAW:0:60000}
          ... (truncated)"
            else
              PLAN_OUTPUT="$PLAN_RAW"
            fi
          fi

          # PR title
          PR_TITLE="${{ inputs.pr_title }}"
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="[${ENV^^}] Deploy infrastructure — ${SHORT_SHA}"
          fi

          # Next environment
          case "$ENV" in
            dev)     NEXT_ENV="qa" ;;
            qa)
              if [ -n "${{ inputs.preprod_account_id }}" ]; then
                NEXT_ENV="preprod"
              else
                NEXT_ENV="prod"
              fi
              ;;
            preprod) NEXT_ENV="prod" ;;
            prod)    NEXT_ENV="" ;;
            *)       NEXT_ENV="" ;;
          esac


          # Build PR body
          PR_BODY="## Terraform Plan — \`${ENV}\` ${STATUS_ICON}

          | Field | Value |
          |-------|-------|
          | **Environment** | \`${ENV}\` |
          | **Mode** | \`${MODE_INFO}\` |
          | **Account ID** | \`${{ inputs.account_id }}\` |
          | **Directory** | \`${{ inputs.working_directory }}\` |
          | **Cost (monthly)** | \`\$${MONTHLY_COST}/mo\` |
          | **Cost (diff)** | \`\$${COST_DIFF}/mo\` |
          | **Security** | ${SECURITY_SUMMARY} |
          | **SAST** | ${SAST_SUMMARY} |
          | **Commit** | \`${SHORT_SHA}\` |
          | **Triggered by** | @${{ github.actor }} |

          ${STATUS_MSG}

          <details><summary>Plan output (expand)</summary>

          \`\`\`hcl
          ${PLAN_OUTPUT}
          \`\`\`

          </details>

          ---

          <!-- DEPLOYMENT_CONTEXT
          version: 3
          environment: ${ENV}
          account_id: ${{ inputs.account_id }}
          ou_name: ${{ inputs.ou_name }}
          working_directory: ${{ inputs.working_directory }}
          extra_vars: ${{ inputs.extra_vars }}
          plan_artifact_name: ${{ needs.plan.outputs.artifact_name }}
          plan_exitcode: ${EXITCODE}
          is_multi_component: ${IS_MULTI}
          next_environment: ${NEXT_ENV}
          dev_account_id: ${{ inputs.dev_account_id }}
          qa_account_id: ${{ inputs.qa_account_id }}
          preprod_account_id: ${{ inputs.preprod_account_id }}
          prod_account_id: ${{ inputs.prod_account_id }}
          dr_enabled: ${{ inputs.dr_enabled }}
          feature_branch: ${{ inputs.feature_branch }}
          source_branch: ${SOURCE}
          target_branch: ${TARGET}
          ci_run_id: ${{ github.run_id }}
          port_run_id: ${{ inputs.port_run_id }}
          monthly_cost: ${MONTHLY_COST}
          cost_diff: ${COST_DIFF}
          -->"


          # Check if PR already exists
          EXISTING_PR=$(gh pr list \
            --head "$SOURCE" \
            --base "$TARGET" \
            --state open \
            --json number,url \
            --jq '.[0]' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body "$PR_BODY"
            echo "Updated existing PR #${PR_NUMBER}"
          else
            PR_URL=$(gh pr create \
              --head "$SOURCE" \
              --base "$TARGET" \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
            gh pr edit "$PR_NUMBER" --add-label "environment/${ENV}" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "terraform" 2>/dev/null || true
            echo "Created new PR #${PR_NUMBER}"
          fi

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      # ─── Auto-merge for DEV PRs (no manual intervention needed) ───
      - name: Auto-merge PR (dev only)
        if: inputs.environment == 'dev' && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.pr_number }}"
          echo "Enabling auto-merge for PR #${PR_NUM} (target: dev)"
          gh pr merge "${PR_NUM}" \
            --repo "${{ github.repository }}" \
            --merge \
            --auto || {
            echo "::warning::Auto-merge could not be enabled. Ensure 'Allow auto-merge' is enabled in repo settings."
            echo "PR #${PR_NUM} requires manual merge."
          }

      # ─── Port.io log: PR created ───
      - name: Log to Port — PR created
        if: inputs.port_run_id != '' && steps.pr.outputs.pr_url != ''
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')

          AUTO_MERGE_MSG=""
          if [ "${{ inputs.environment }}" = "dev" ]; then
            AUTO_MERGE_MSG=" Auto-merge habilitado."
          fi

          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"PR creado: ${{ steps.pr.outputs.pr_url }}.${AUTO_MERGE_MSG}\"}"
