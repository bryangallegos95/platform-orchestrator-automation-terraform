# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  DEPRECATED — v2.3.x (legacy monolithic CI)                                │
# │                                                                             │
# │  This workflow is DEPRECATED as of v2.4.0 (ADR-008).                        │
# │  New repos should use the split workflows:                                  │
# │    - ci-validate.yml  → format + lint + sast (ONE time)                     │
# │    - ci-plan.yml      → plan + cost + security (PER component)              │
# │    - ci-create-pr.yml → consolidated PR (ONE time)                          │
# │                                                                             │
# │  This file is kept for backward compatibility with existing repos           │
# │  that have not yet migrated to the new orchestrator pattern.                │
# │                                                                             │
# │  DO NOT add new features to this file.                                      │
# │  Migration guide: platform-knowledge-base/strategy/decisions/008-*          │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ORG-DEVOPS/.github/workflows/ci.yml
#
# Reusable CI workflow — called by product (son) repos.
#
# PREREQUISITES:
#   Runner image v2.0.0+ with pre-installed:
#   Terraform, Terragrunt, TFLint (+ AWS plugin), Infracost, gh CLI, Python 3.9+
#
# JOBS:
#   ⓪ resolve    → derives bucket, state key, region from environment input
#   ① format     → terragrunt hclfmt --check
#   ② lint       → tflint (tags + naming) + naming_pattern_validator.sh
#   ③ plan       → terragrunt validate + plan, uploads artifact
#   ④ cost       → infracost breakdown (only if changes detected)
#   ⑤ security   → Prowler IaC + AWS CIS 2.0 (primary gate)
#   ⑤b sast      → Checkmarx SAST/SCA (conditional — only if app code detected)
#   ⑥ create-pr  → auto-creates PR with plan + cost + security + DEPLOYMENT_CONTEXT
#
# ENVIRONMENT → RUNNER TAG → REGION MAPPING:
#   dev      → [self-hosted, terraform, dev]      → us-east-1
#   qa       → [self-hosted, terraform, qa]       → us-east-1
#   preprod  → [self-hosted, terraform, preprod]  → us-east-1
#   prod     → [self-hosted, terraform, prod]     → us-east-1
#   dr       → [self-hosted, terraform, dr]       → us-east-2
#
# RUNNER OVERRIDE:
#   If `runner_label` is set, it replaces the environment in the runner tag.
#   Example: runner_label=prod → always uses [self-hosted, terraform, prod]
#   Use case: hub-networking (single account, all envs deploy from prod runner).

#----------- Integración BeyondTrust--------------------------------------------
# FLUJO VALIDADO (4 pasos):
#   1. POST /auth/connect/token          → OAuth access_token
#   2. POST /Auth/SignAppin (con cookie) → sesión activa
#   3. GET  /secrets-safe/secrets        → lista todos los secretos del vault
#              filtrar por .Title        → obtener .Id
#   4. GET  /secrets-safe/secrets/{Id}   → valor real en .Password
#      POST /Auth/Signout                → cerrar sesión
#
# AISLAMIENTO POR VAULT:
#   Cada Application User (BYT_CLIENT_ID_DEV, _QA, _PREPROD, _PROD) solo tiene
#   acceso a su vault (VaultDev, VaultQA, VaultPreprod, VaultProd).
#   El listado /secrets-safe/secrets ya está scoped al vault correcto — no hay
#   que pasar el vault ni el folder path. Solo el Title del secreto.

name: "[reusable] Terraform CI"

on:
  workflow_call:
    inputs:
      # ─── Required inputs ───────────────────────────────────────
      environment:
        description: "Target environment: dev, qa, preprod, prod, dr"
        required: true
        type: string
      working_directory:
        description: "Path to Terragrunt environment. E.g. environments/dev"
        required: true
        type: string
      account_id:
        description: "AWS account ID for the target environment."
        required: true
        type: string
      ou_name:
        description: "OU / product name — root folder in state bucket."
        required: true
        type: string

      # ─── Runner override ─────────────────────────────────────────
      runner_label:
        description: |
          Override the runner tag used for self-hosted jobs.
          Default: uses the environment value (dev/qa/preprod/prod/dr).
          Use case: repos that deploy all environments from a single account
          (e.g., hub-networking) can set runner_label=prod to always use
          the prod runner regardless of the target environment.
        required: false
        type: string
        default: ""

      # ─── Optional inputs ───────────────────────────────────────
      extra_vars:
        description: |
          Space-separated Terraform -var overrides injected at plan time.
          Format: "key1=value1 key2=value2"
          Example: "tgw_id=tgw-0abc1234 service=datosanalitica ambiente=dev"
        required: false
        type: string
        default: ""

      checkmarx_scan:
        description: |
          Run Checkmarx SAST/SCA scan for application code.
          Only runs if application code is detected (src/, lambda/, etc.).
          Default: true (auto-detect mode).
          Set to false to skip entirely.
        required: false
        type: boolean
        default: true

      security_scan:
        description: |
          Run Prowler security scan (IaC + AWS CIS 2.0).
          Default: true (secure by default).
          Set to false only for PoC repos — requires CloudOps approval.
        required: false
        type: boolean
        default: true

      fail_on_high_critical:
        description: |
          Fail pipeline and block PR creation on CRITICAL/HIGH findings.
          Default: true (enforce by default).
          Set to false for report-only mode — requires CloudOps approval
          via branch protection on testing/master.
        required: false
        type: boolean
        default: true
        
      secret_titles:
        description: |
          JSON array de secretos a recuperar de BeyondTrust Secrets Safe
          e inyectar como TF_VAR_* en el plan.

          Formato:
            '[{"title": "client-secret", "tf_var": "entra_client_secret"}]'

          Ejemplo multi-secreto:
            '[
              {"title": "client-secret",    "tf_var": "entra_client_secret"},
              {"title": "htpasswd-password", "tf_var": "htpasswd_password"}
            ]'

          Requisitos:
            - BYT_CLIENT_ID_<ENV> y BYT_CLIENT_SECRET_<ENV> disponibles vía secrets: inherit
            - BT_URL seteado como GitHub Variable (vars.BT_URL)
            - runner con curl y jq (pre-instalados en la imagen del runner)
            - El Application User del env tiene acceso al secreto en su vault
        required: false
        type: string
        default: ""

      create_pr:
        description: "Whether CI should auto-create a Pull Request."
        required: false
        type: boolean
        default: true
      pr_source_branch:
        description: "Source branch for the PR (e.g. feature/add-vpc or dev)."
        required: false
        type: string
        default: ""
      pr_target_branch:
        description: "Target branch for the PR (e.g. dev, testing, staging, master)."
        required: false
        type: string
        default: ""
      pr_title:
        description: "Title for the auto-created PR."
        required: false
        type: string
        default: ""
      target_role_name:
        description: "IAM role name to assume in target account."
        required: false
        type: string
        default: "terraform-apply-role"

      # ─── Deployment context (passthrough for promotion chain) ───
      dev_account_id:
        description: "DEV account ID — passed through for promotion chain."
        required: false
        type: string
        default: ""
      qa_account_id:
        description: "QA account ID — passed through for promotion chain."
        required: false
        type: string
        default: ""
      preprod_account_id:
        description: "PREPROD account ID — empty means preprod is skipped."
        required: false
        type: string
        default: ""
      prod_account_id:
        description: "PROD account ID — passed through for promotion chain."
        required: false
        type: string
        default: ""
      dr_enabled:
        description: "Whether DR (us-east-2) is enabled for prod."
        required: false
        type: boolean
        default: false
      feature_branch:
        description: "Original feature branch (for traceability)."
        required: false
        type: string
        default: ""

    outputs:
      plan_exitcode:
        description: "0=no changes, 2=changes present."
        value: ${{ jobs.plan.outputs.exitcode }}
      plan_artifact_name:
        description: "Artifact name to pass to cd.yml."
        value: ${{ jobs.plan.outputs.artifact_name }}
      environment:
        description: "Resolved environment name."
        value: ${{ jobs.resolve.outputs.environment }}
      pr_number:
        description: "PR number if created."
        value: ${{ jobs.create-pr.outputs.pr_number }}
      pr_url:
        description: "PR URL if created."
        value: ${{ jobs.create-pr.outputs.pr_url }}

concurrency:
  group: "tf-ci-${{ inputs.environment }}-${{ inputs.ou_name }}-${{ github.event.pull_request.number || github.ref_name }}"
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  ⓪ RESOLVE
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve"
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    outputs:
      environment: ${{ steps.derive.outputs.environment }}
      region:      ${{ steps.derive.outputs.region }}
      bucket:      ${{ steps.derive.outputs.bucket }}
      state_key:   ${{ steps.derive.outputs.state_key }}

    steps:
      - name: Derive infrastructure context
        id: derive
        run: |
          ENV="${{ inputs.environment }}"
          REPO="${{ github.event.repository.name }}"
          OU="${{ inputs.ou_name }}"

          case "$ENV" in
            dev|qa|preprod|prod)
              REGION="us-east-1"
              BUCKET="s3-aw-ue1-terraform-state-${ENV}"
              ;;
            dr)
              REGION="us-east-2"
              BUCKET="s3-aw-ue2-terraform-state-dr"
              ;;
            *)
              echo "::error::Invalid environment: '$ENV'. Valid: dev, qa, preprod, prod, dr"
              exit 1
              ;;
          esac

          STATE_KEY="${OU}/${REPO}/terraform.tfstate"

          echo "environment=$ENV"     >> $GITHUB_OUTPUT
          echo "region=$REGION"       >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET"       >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ⓪ Resolved Context
          | Key | Value |
          |-----|-------|
          | Environment | \`${ENV}\` |
          | Region | \`${REGION}\` |
          | Bucket | \`${BUCKET}\` |
          | State key | \`${STATE_KEY}\` |
          | Account ID | \`${{ inputs.account_id }}\` |
          | Working dir | \`${{ inputs.working_directory }}\` |
          | Extra vars | \`${{ inputs.extra_vars }}\` |
          EOF

  # ─────────────────────────────────────────────
  #  ① FORMAT
  # ─────────────────────────────────────────────
  format:
    name: "① Format"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Terragrunt hclfmt
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt hclfmt --check --diff

  # ─────────────────────────────────────────────
  #  ② LINT + GOVERNANCE
  # ─────────────────────────────────────────────
  lint:
    name: "② Lint"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Checkout orchestrator (governance files)
        uses: actions/checkout@v4
        with:
          repository: bin-transversales-devops/platform-orchestrator-automation-terraform
          ref: master
          path: .orchestrator
          token: ${{ secrets.GH_TOKEN }}

      - name: Copy governance files
        run: |
          # Copy .tflint.hcl from orchestrator if not present in repo
          if [ ! -f ".tflint.hcl" ]; then
            cp .orchestrator/.tflint.hcl .tflint.hcl
            echo "Copied .tflint.hcl from orchestrator"
          fi
          # Copy naming validator script
          mkdir -p scripts
          cp .orchestrator/scripts/naming_pattern_validator.sh scripts/
          chmod +x scripts/naming_pattern_validator.sh
          echo "Copied naming_pattern_validator.sh from orchestrator"

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-lint-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}
          
      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
          
      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Run TFLint (tags + naming + best practices)
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "── Running TFLint with enterprise governance rules ──"
          tflint --format=compact
          echo ""
          echo "✅ TFLint passed: tags, naming convention, best practices."

  # ─────────────────────────────────────────────
  #  ③ VALIDATE + PLAN
  # ─────────────────────────────────────────────
  plan:
    name: "③ Plan"
    needs: [resolve, format, lint]
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}
      
    outputs:
      exitcode:      ${{ steps.plan.outputs.exitcode }}
      artifact_name: ${{ steps.artifact_name.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-plan-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}
          
      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
          
      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Retrieve secrets from BeyondTrust Secrets Safe
        if: inputs.secret_titles != ''
        env:
          _BT_URL: ${{ vars.BT_URL }}
          # Credenciales per-env — indirect expansion selecciona la correcta en runtime.
          # DR usa PROD (mismo vault). Unused secrets llegan vacíos — inofensivo.
          _BYT_CLIENT_ID_DEV:         ${{ secrets.BYT_CLIENT_ID_DEV }}
          _BYT_CLIENT_SECRET_DEV:     ${{ secrets.BYT_CLIENT_SECRET_DEV }}
          _BYT_CLIENT_ID_QA:          ${{ secrets.BYT_CLIENT_ID_QA }}
          _BYT_CLIENT_SECRET_QA:      ${{ secrets.BYT_CLIENT_SECRET_QA }}
          _BYT_CLIENT_ID_PREPROD:     ${{ secrets.BYT_CLIENT_ID_PREPROD }}
          _BYT_CLIENT_SECRET_PREPROD: ${{ secrets.BYT_CLIENT_SECRET_PREPROD }}
          _BYT_CLIENT_ID_PROD:        ${{ secrets.BYT_CLIENT_ID_PROD }}
          _BYT_CLIENT_SECRET_PROD:    ${{ secrets.BYT_CLIENT_SECRET_PROD }}
          _SECRET_TITLES: ${{ inputs.secret_titles }}
        run: |
          echo "── Retrieving secrets from BeyondTrust Secrets Safe ──"

          # ── Seleccionar credenciales del ambiente via indirect expansion ──
          ENV="${{ inputs.environment }}"
          case "$ENV" in
            dr)      ENV_KEY="PROD" ;;
            dev)     ENV_KEY="DEV" ;;
            qa)      ENV_KEY="QA" ;;
            preprod) ENV_KEY="PREPROD" ;;
            prod)    ENV_KEY="PROD" ;;
            *)
              echo "::error::Ambiente desconocido '${ENV}'."
              exit 1
              ;;
          esac

          # Corrección: indirect expansion con nombres de variables válidos en bash
          ID_VAR="_BYT_CLIENT_ID_${ENV_KEY}"
          SECRET_VAR="_BYT_CLIENT_SECRET_${ENV_KEY}"
          BT_CLIENT_ID="${!ID_VAR}"
          BT_CLIENT_SECRET="${!SECRET_VAR}"

          if [ -z "$BT_CLIENT_ID" ] || [ -z "$BT_CLIENT_SECRET" ]; then
            echo "::error::Credenciales BeyondTrust no encontradas para env '${ENV}' (key: ${ENV_KEY})."
            echo "::error::Verifica que existen los secrets: BYT_CLIENT_ID_${ENV_KEY} y BYT_CLIENT_SECRET_${ENV_KEY}"
            exit 1
          fi

          if [ -z "$_BT_URL" ]; then
            echo "::error::BT_URL no está seteado."
            echo "::error::Créalo en: Settings → Secrets and variables → Actions → Variables → BT_URL"
            exit 1
          fi

          # ── Paso 1: OAuth token ───────────────────────────────────────────
          echo "Autenticando con BeyondTrust (env=${ENV}, vault key=${ENV_KEY})..."
          TOKEN=$(curl -s -f -X POST "${_BT_URL}/auth/connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${BT_CLIENT_ID}&client_secret=${BT_CLIENT_SECRET}" \
            | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::BeyondTrust no devolvió access_token. Verifica BYT_CLIENT_ID_${ENV_KEY} y BYT_CLIENT_SECRET_${ENV_KEY}."
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          # ── Paso 2: SignAppin — crear sesión con cookie ───────────────────
          BT_COOKIE=$(mktemp /tmp/bt_session_XXXXXX.txt)
          SIGNIN_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -c "$BT_COOKIE" \
            -X POST "${_BT_URL}/Auth/SignAppin" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "")

          if [ "$SIGNIN_HTTP" != "200" ]; then
            echo "::error::BeyondTrust SignAppin falló (HTTP ${SIGNIN_HTTP})."
            rm -f "$BT_COOKIE"
            exit 1
          fi
          echo "✅ Sesión BeyondTrust establecida."

          # ── Paso 3: Listar todos los secretos del vault (scoped al Application User) ──
          ALL_SECRETS=$(curl -s -f -b "$BT_COOKIE" \
            -H "Authorization: Bearer $TOKEN" \
            "${_BT_URL}/secrets-safe/secrets")

          # ── Paso 4: Por cada entry en secret_titles → buscar ID → fetch valor ──
          COUNT=0
          echo "$_SECRET_TITLES" | jq -c '.[]' | while IFS= read -r entry; do
            TITLE=$(echo "$entry"  | jq -r '.title')
            TF_VAR=$(echo "$entry" | jq -r '.tf_var')

            # Resolver ID filtrando por Title en el listado
            SECRET_ID=$(echo "$ALL_SECRETS" | jq -r \
              --arg t "$TITLE" '.[] | select(.Title == $t) | .Id' | head -1)

            if [ -z "$SECRET_ID" ]; then
              echo "::error::Secreto con Title '${TITLE}' no encontrado en el vault de env '${ENV}'."
              echo "::error::Verifica que el secreto existe y el Application User BYT_CLIENT_ID_${ENV_KEY} tiene acceso."
              curl -s -b "$BT_COOKIE" -X POST "${_BT_URL}/Auth/Signout" \
                -H "Authorization: Bearer $TOKEN" > /dev/null 2>&1 || true
              rm -f "$BT_COOKIE"
              exit 1
            fi

            # Fetch valor real por ID (el listado no incluye el valor por seguridad)
            SECRET_VALUE=$(curl -s -f -b "$BT_COOKIE" \
              -H "Authorization: Bearer $TOKEN" \
              "${_BT_URL}/secrets-safe/secrets/${SECRET_ID}" \
              | jq -r '.Password // empty')

            if [ -z "$SECRET_VALUE" ]; then
              echo "::error::Secreto '${TITLE}' (id: ${SECRET_ID}) devolvió valor vacío."
              curl -s -b "$BT_COOKIE" -X POST "${_BT_URL}/Auth/Signout" \
                -H "Authorization: Bearer $TOKEN" > /dev/null 2>&1 || true
              rm -f "$BT_COOKIE"
              exit 1
            fi

            # Maskear y exportar como TF_VAR_*
            echo "::add-mask::$SECRET_VALUE"
            printf 'TF_VAR_%s=%s\n' "$TF_VAR" "$SECRET_VALUE" >> $GITHUB_ENV
            echo "✅ TF_VAR_${TF_VAR} inyectado (title: ${TITLE})"
            COUNT=$((COUNT + 1))
          done

          # ── Signout + cleanup ─────────────────────────────────────────────
          curl -s -b "$BT_COOKIE" -X POST "${_BT_URL}/Auth/Signout" \
            -H "Authorization: Bearer $TOKEN" > /dev/null 2>&1 || true
          rm -f "$BT_COOKIE"
          echo "── Sesión BeyondTrust cerrada. ──"
          
      - name: Terragrunt validate
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt validate

      - name: Terragrunt plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
          TF_CLI_ARGS: "-no-color"
          TERRAGRUNT_NO_COLOR: "true"
        run: |
          # Build -var flags from extra_vars input
          EXTRA_VAR_FLAGS=""
          if [ -n "${{ inputs.extra_vars }}" ]; then
            for pair in ${{ inputs.extra_vars }}; do
              EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
            done
          fi

          set +e
          eval terragrunt plan \
            $EXTRA_VAR_FLAGS \
            -out=$(pwd)/tfplan \
            -input=false \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt
          EXITCODE=${PIPESTATUS[0]}
          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT

          if [ "$EXITCODE" -eq "1" ]; then
            echo "::error::Terragrunt plan failed."
            exit 1
          fi

          # Summary
          if [ "$EXITCODE" -eq "0" ]; then
            echo "### ③ Plan: ✅ No changes" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ③ Plan: ⚠️ Changes detected" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 plan_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: Build artifact name
        id: artifact_name
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ENV="${{ inputs.environment }}"
          echo "value=tfplan-${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 14
          if-no-files-found: error

  # ─────────────────────────────────────────────
  #  ④ COST ESTIMATE
  #  Uses Infracost CLI pre-installed in runner image.
  #  INFRACOST_API_KEY injected via pod environment.
  # ─────────────────────────────────────────────
  cost:
    name: "④ Cost"
    needs: [resolve, plan]
    if: needs.plan.outputs.exitcode == '2'
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    env:
      OU_NAME: ${{ inputs.ou_name }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}
      
    outputs:
      monthly_cost: ${{ steps.parse.outputs.monthly_cost }}
      cost_diff:    ${{ steps.parse.outputs.cost_diff }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "infracost-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}
          
      - name: Configure git for private modules
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
          
      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ${{ inputs.working_directory }}

      - name: Convert plan to JSON
        working-directory: ${{ inputs.working_directory }}
        run: terragrunt show -json $(pwd)/tfplan > tfplan.json

      - name: Generate Infracost estimate
        working-directory: ${{ inputs.working_directory }}
        run: |
          infracost breakdown \
            --path tfplan.json \
            --format json \
            --out-file infracost.json

      - name: Parse cost output
        id: parse
        working-directory: ${{ inputs.working_directory }}
        run: |
          MONTHLY=$(jq -r '.totalMonthlyCost // "0.00"' infracost.json)
          DIFF=$(jq -r '.diffTotalMonthlyCost // "0.00"' infracost.json 2>/dev/null || echo "0.00")
          echo "monthly_cost=$MONTHLY" >> $GITHUB_OUTPUT
          echo "cost_diff=$DIFF" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ④ Cost Estimate
          | Metric | Value |
          |--------|-------|
          | Monthly cost | \`\$${MONTHLY}/mo\` |
          | Cost diff | \`\$${DIFF}/mo\` |
          EOF

      - name: Upload cost artifact
        uses: actions/upload-artifact@v4
        with:
          name: infracost-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ inputs.working_directory }}/infracost.json
          retention-days: 14

  # ─────────────────────────────────────────────
  #  ⑤ SECURITY — Prowler IaC (Static Analysis)
  #  Primary security gate — replaces Checkmarx KICS.
  #
  #  What it does:
  #    1. Installs Prowler via pip (until added to runner Dockerfile)
  #    2. Runs IaC static analysis against Terraform files (NO AWS credentials needed)
  #    3. Outputs SARIF for GitHub Code Scanning integration
  #    4. Gates on CRITICAL/HIGH findings (blocks PR creation)
  #
  #  Architecture:
  #    - CI: prowler iac (local, static, no secrets) → JSON results
  #    - CD: POST /api/v1/scans → Prowler App (pending purchase from AWS Marketplace)
  #    - Continuous: Prowler App Scheduler (managed by Security team — pending)
  #
  #  Control:
  #    - input security_scan: true|false (default: true)
  #    - input fail_on_high_critical: true|false (default: true)
  # ─────────────────────────────────────────────
  security:
    name: "⑤ Security"
    needs: [resolve, plan]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      inputs.security_scan
    runs-on: ubuntu-latest

    outputs:
      scan_executed:   ${{ steps.scan_result.outputs.scan_executed }}
      total_critical:  ${{ steps.evaluate.outputs.total_critical }}
      total_high:      ${{ steps.evaluate.outputs.total_high }}
      total_medium:    ${{ steps.evaluate.outputs.total_medium }}
      prowler_summary: ${{ steps.build_summary.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prowler + Trivy
        run: |
          echo "── Installing Prowler + Trivy (IaC scan engine) ──"
          pip install prowler --quiet
          prowler --version

          # Trivy is required by Prowler IaC provider as the scanning backend
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
          echo "✅ Prowler + Trivy installed."

      - name: Run Prowler IaC scan
        id: prowler_scan
        continue-on-error: true
        run: |
          echo "── Prowler IaC Scan (Terraform static analysis — no AWS credentials needed) ──"
          mkdir -p /tmp/prowler-results

          set +e
          prowler iac \
            --scan-path . \
            --output-formats json-ocsf \
            --output-directory /tmp/prowler-results \
            --no-color \
            --verbose 2>&1 | tee /tmp/prowler-output.txt
          PROWLER_EXIT=$?
          set -e

          echo "exit_code=$PROWLER_EXIT" >> $GITHUB_OUTPUT
          echo "Prowler IaC scan exit code: $PROWLER_EXIT"
      - name: Evaluate scan results
        id: evaluate
        run: |
          # Parse results from Prowler stdout summary table.
          # With --no-color, the table line looks like:
          # | iac        | terraform | FAIL (1) |          0 |      0 |        0 |     1 |       0 |

          PROWLER_OUTPUT="/tmp/prowler-output.txt"
          TOTAL_CRIT=0
          TOTAL_HIGH=0
          TOTAL_MED=0

          if [ -f "$PROWLER_OUTPUT" ]; then
            # Strip any remaining ANSI escape codes
            CLEAN_OUTPUT=$(sed 's/\x1b\[[0-9;]*m//g' "$PROWLER_OUTPUT")

            # Find the line with "FAIL (" that is the summary table (not individual checks)
            FAIL_LINE=$(echo "$CLEAN_OUTPUT" | grep "FAIL (" | grep -v "FAIL AWS\|FAIL AZU\|FAIL GCP" | tail -1 || true)

            if [ -n "$FAIL_LINE" ]; then
              echo "Found FAIL summary line: $FAIL_LINE"

              # Extract the part AFTER "FAIL (N)" — this contains the severity columns
              AFTER_FAIL=$(echo "$FAIL_LINE" | sed 's/.*FAIL ([0-9]*)//')
              echo "  After FAIL: $AFTER_FAIL"

              # Now extract only digits from this part (should be: Critical High Medium Low Muted)
              readarray -t NUMS < <(echo "$AFTER_FAIL" | grep -oE '[0-9]+')

              echo "  Numbers after FAIL: ${NUMS[*]} (count: ${#NUMS[@]})"

              if [ ${#NUMS[@]} -ge 3 ]; then
                TOTAL_CRIT=${NUMS[0]}
                TOTAL_HIGH=${NUMS[1]}
                TOTAL_MED=${NUMS[2]}
              fi

              echo "  Parsed: Critical=$TOTAL_CRIT, High=$TOTAL_HIGH, Medium=$TOTAL_MED"
            else
              echo "No FAIL line found in summary table - all checks passed."
            fi
          else
            echo "::warning::Prowler output file not found."
          fi

          echo "-- Final: Critical=$TOTAL_CRIT, High=$TOTAL_HIGH, Medium=$TOTAL_MED --"
          echo "total_critical=$TOTAL_CRIT" >> $GITHUB_OUTPUT
          echo "total_high=$TOTAL_HIGH" >> $GITHUB_OUTPUT
          echo "total_medium=$TOTAL_MED" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### Security Scan (Prowler IaC)
          | Severity | Count |
          |----------|-------|
          | CRITICAL | $TOTAL_CRIT |
          | HIGH | $TOTAL_HIGH |
          | MEDIUM | $TOTAL_MED |
          | **Mode** | Static IaC analysis (no AWS credentials) |
          | **Post-deploy** | Prowler App (pending AWS Marketplace purchase) |
          EOF

      - name: Build summary for PR
        id: build_summary
        run: |
          CRIT="${{ steps.evaluate.outputs.total_critical }}"
          HIGH="${{ steps.evaluate.outputs.total_high }}"
          MED="${{ steps.evaluate.outputs.total_medium }}"

          if [ "$CRIT" = "0" ] && [ "$HIGH" = "0" ] && [ "$MED" = "0" ]; then
            SUMMARY="✅ **Security (Prowler IaC):** No misconfigurations found"
          else
            SUMMARY="🔒 **Security (Prowler IaC):** 🔴 $CRIT Critical | 🟠 $HIGH High | 🟡 $MED Medium"
          fi
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Mark scan as executed
        id: scan_result
        run: echo "scan_executed=true" >> $GITHUB_OUTPUT

      - name: Upload Prowler results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prowler-iac-${{ inputs.environment }}-${{ github.sha }}
          path: /tmp/prowler-results/
          retention-days: 14

      - name: Enforce security gate
        if: inputs.fail_on_high_critical
        run: |
          TOTAL_CRIT="${{ steps.evaluate.outputs.total_critical }}"
          TOTAL_HIGH="${{ steps.evaluate.outputs.total_high }}"

          if [ "$TOTAL_CRIT" -gt 0 ] || [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "::error::Security gate FAILED: $TOTAL_CRIT CRITICAL + $TOTAL_HIGH HIGH IaC misconfigurations."
            echo "::error::Fix the findings before this PR can be created."
            echo "::error::Review the Prowler artifact or GitHub Code Scanning tab for details."
            exit 1
          fi

          echo "✅ Security gate PASSED (Prowler IaC): 0 CRITICAL, 0 HIGH."

  # ─────────────────────────────────────────────
  #  ⑤b SAST — Checkmarx (Conditional)
  #  Only runs if APPLICATION CODE is detected in the repo.
  #  IaC-only repos (majority) skip this entirely.
  #
  #  Detection: looks for src/, lambda/, functions/, app/,
  #  or source files (*.py, *.js, *.ts, *.go, *.java, *.cs)
  #  outside of .terraform/ directories.
  # ─────────────────────────────────────────────
  sast:
    name: "⑤b SAST"
    needs: [resolve, plan]
    if: |
      always() &&
      needs.plan.result == 'success' &&
      inputs.checkmarx_scan
    runs-on: ubuntu-latest

    outputs:
      has_app_code:   ${{ steps.detect.outputs.has_app_code }}
      sast_executed:  ${{ steps.scan_result.outputs.sast_executed }}
      sast_critical:  ${{ steps.evaluate.outputs.total_critical }}
      sast_high:      ${{ steps.evaluate.outputs.total_high }}
      sast_summary:   ${{ steps.build_summary.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch || github.ref }}

      - name: Detect application code
        id: detect
        run: |
          HAS_CODE="false"

          # Check for application code directories
          for dir in src app lambda functions scripts/app lib pkg cmd handlers controllers; do
            if [ -d "$dir" ]; then
              HAS_CODE="true"
              echo "Found application code directory: $dir"
              break
            fi
          done

          # Check for source files (excluding .terraform and vendor)
          if [ "$HAS_CODE" = "false" ]; then
            for pattern in "*.py" "*.js" "*.ts" "*.go" "*.java" "*.cs" "*.rb"; do
              if find . -maxdepth 3 -name "$pattern" \
                -not -path "./.terraform/*" \
                -not -path "./vendor/*" \
                -not -path "./node_modules/*" \
                -not -path "./.orchestrator/*" | grep -q .; then
                HAS_CODE="true"
                echo "Found source files matching: $pattern"
                break
              fi
            done
          fi

          echo "has_app_code=$HAS_CODE" >> $GITHUB_OUTPUT

          if [ "$HAS_CODE" = "true" ]; then
            echo "Application code detected. Checkmarx SAST will run."
          else
            echo "No application code found. IaC-only repo — Checkmarx SAST skipped."
            echo "### ⑤b SAST: Skipped (IaC-only repo)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Checkmarx SAST/SCA
        id: cxscan
        if: steps.detect.outputs.has_app_code == 'true'
        continue-on-error: true
        uses: checkmarx/ast-github-action@main
        with:
          cx_tenant: ${{ secrets.CX_TENANT }}
          base_uri: ${{ vars.CX_BASE_URI || 'https://us.ast.checkmarx.net/' }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          project_name: ${{ github.repository }}-app
          branch: ${{ inputs.pr_source_branch || github.ref_name }}
          scan_params: >-
            --scan-types sast,sca
            --report-format json
            --output-path .

      - name: Evaluate SAST results
        id: evaluate
        if: steps.detect.outputs.has_app_code == 'true'
        run: |
          if [ ! -f "cx_result.json" ]; then
            echo "::warning::Checkmarx scan did not produce results file."
            echo "total_critical=0" >> $GITHUB_OUTPUT
            echo "total_high=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          SAST_CRIT=$(jq '[(.results // [])[] | select(.type=="sast" and .severity=="CRITICAL")] | length' cx_result.json)
          SAST_HIGH=$(jq '[(.results // [])[] | select(.type=="sast" and .severity=="HIGH")] | length' cx_result.json)
          SCA_CRIT=$(jq '[(.results // [])[] | select(.type=="sca" and .severity=="CRITICAL")] | length' cx_result.json)
          SCA_HIGH=$(jq '[(.results // [])[] | select(.type=="sca" and .severity=="HIGH")] | length' cx_result.json)

          TOTAL_CRIT=$((SAST_CRIT + SCA_CRIT))
          TOTAL_HIGH=$((SAST_HIGH + SCA_HIGH))

          echo "total_critical=$TOTAL_CRIT" >> $GITHUB_OUTPUT
          echo "total_high=$TOTAL_HIGH" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ⑤b SAST (Checkmarx — Application Code)
          | Severity | Count |
          |----------|-------|
          | CRITICAL | $TOTAL_CRIT |
          | HIGH | $TOTAL_HIGH |
          EOF

      - name: Build summary for PR
        id: build_summary
        run: |
          if [ "${{ steps.detect.outputs.has_app_code }}" != "true" ]; then
            echo "summary=⏭️ **SAST:** Skipped (IaC-only repo)" >> $GITHUB_OUTPUT
            exit 0
          fi
          CRIT="${{ steps.evaluate.outputs.total_critical || '0' }}"
          HIGH="${{ steps.evaluate.outputs.total_high || '0' }}"
          if [ "$CRIT" = "0" ] && [ "$HIGH" = "0" ]; then
            echo "summary=✅ **SAST (Checkmarx):** No app vulnerabilities" >> $GITHUB_OUTPUT
          else
            echo "summary=🔒 **SAST (Checkmarx):** 🔴 $CRIT Critical | 🟠 $HIGH High" >> $GITHUB_OUTPUT
          fi

      - name: Mark SAST as executed
        id: scan_result
        run: |
          if [ "${{ steps.detect.outputs.has_app_code }}" = "true" ]; then
            echo "sast_executed=true" >> $GITHUB_OUTPUT
          else
            echo "sast_executed=false" >> $GITHUB_OUTPUT
          fi

      - name: Enforce SAST gate
        if: |
          steps.detect.outputs.has_app_code == 'true' &&
          inputs.fail_on_high_critical
        run: |
          TOTAL_CRIT="${{ steps.evaluate.outputs.total_critical }}"
          TOTAL_HIGH="${{ steps.evaluate.outputs.total_high }}"

          if [ "$TOTAL_CRIT" -gt 0 ] || [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "::error::SAST gate FAILED: $TOTAL_CRIT CRITICAL + $TOTAL_HIGH HIGH vulnerabilities in app code."
            exit 1
          fi
          echo "✅ SAST gate PASSED: 0 CRITICAL, 0 HIGH in application code."

  # ─────────────────────────────────────────────
  #  ⑥ CREATE PR
  #  Auto-creates a Pull Request with:
  #    - Plan + cost in visible body
  #    - DEPLOYMENT_CONTEXT as hidden HTML metadata
  #      (parsed by cd-on-merge.yml after merge)
  # ─────────────────────────────────────────────
  create-pr:
    name: "⑥ Create PR"
    needs: [resolve, plan, cost, security, sast]
    if: |
      always() &&
      inputs.create_pr &&
      inputs.pr_source_branch != '' &&
      inputs.pr_target_branch != '' &&
      needs.plan.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped')
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_url:    ${{ steps.pr.outputs.pr_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_source_branch }}
          fetch-depth: 0

      - name: Download plan output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: /tmp/plan-artifacts

      - name: Create or update Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SOURCE="${{ inputs.pr_source_branch }}"
          TARGET="${{ inputs.pr_target_branch }}"
          ENV="${{ inputs.environment }}"
          EXITCODE="${{ needs.plan.outputs.exitcode }}"
          BUCKET="${{ needs.resolve.outputs.bucket }}"
          STATE_KEY="${{ needs.resolve.outputs.state_key }}"
          REGION="${{ needs.resolve.outputs.region }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          MONTHLY_COST="${{ needs.cost.outputs.monthly_cost }}"
          COST_DIFF="${{ needs.cost.outputs.cost_diff }}"
          SECURITY_SUMMARY="${{ needs.security.outputs.prowler_summary }}"

          # Default cost values if cost job was skipped (no changes)
          if [ -z "$MONTHLY_COST" ]; then MONTHLY_COST="N/A"; fi
          if [ -z "$COST_DIFF" ]; then COST_DIFF="N/A"; fi
          if [ -z "$SECURITY_SUMMARY" ]; then SECURITY_SUMMARY="⏭️ Security scan skipped"; fi

          # Determine change status
          if [ "$EXITCODE" = "0" ]; then
            STATUS_ICON="✅ No changes"
            STATUS_MSG="> ℹ️ No infrastructure changes. Apply will be skipped in CD."
          else
            STATUS_ICON="⚠️ Changes detected"
            STATUS_MSG="> ⚡ Plan saved. CD applies this **exact plan** after merge — no re-plan."
          fi

          # Read plan output (truncate if too large)
          PLAN_OUTPUT="Plan output not available."
          if [ -f /tmp/plan-artifacts/plan_output.txt ]; then
            PLAN_RAW=$(cat /tmp/plan-artifacts/plan_output.txt)
            if [ ${#PLAN_RAW} -gt 60000 ]; then
              PLAN_OUTPUT="${PLAN_RAW:0:60000}

          ⚠️ Output truncated — see Actions for full log."
            else
              PLAN_OUTPUT="$PLAN_RAW"
            fi
          fi

          # Build PR title
          PR_TITLE="${{ inputs.pr_title }}"
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="🚀 [${ENV^^}] Deploy infrastructure — ${SHORT_SHA}"
          fi

          # Determine next environment for metadata
          case "$ENV" in
            dev)     NEXT_ENV="qa" ;;
            qa)
              if [ -n "${{ inputs.preprod_account_id }}" ]; then
                NEXT_ENV="preprod"
              else
                NEXT_ENV="prod"
              fi
              ;;
            preprod) NEXT_ENV="prod" ;;
            prod)    NEXT_ENV="" ;;
            *)       NEXT_ENV="" ;;
          esac

          # Determine approval teams for next transition
          case "$ENV" in
            dev)     NEXT_APPROVAL_TEAMS="Desarrollo,cloud-ops" ;;
            qa)      NEXT_APPROVAL_TEAMS="cloud-ops,Seguridad" ;;
            preprod) NEXT_APPROVAL_TEAMS="cloud-ops,Infraestructura" ;;
            prod)    NEXT_APPROVAL_TEAMS="" ;;
            *)       NEXT_APPROVAL_TEAMS="" ;;
          esac

          # Build PR body with visible content + hidden metadata
          PR_BODY="## 🔍 Terraform Plan — \`${ENV}\` ${STATUS_ICON}

          | Field | Value |
          |-------|-------|
          | **Environment** | \`${ENV}\` |
          | **Region** | \`${REGION}\` |
          | **Account ID** | \`${{ inputs.account_id }}\` |
          | **Directory** | \`${{ inputs.working_directory }}\` |
          | **State bucket** | \`${BUCKET}\` |
          | **State key** | \`${STATE_KEY}\` |
          | **Extra vars** | \`${{ inputs.extra_vars }}\` |
          | **Commit** | \`${SHORT_SHA}\` |
          | **Cost (monthly)** | \`\$${MONTHLY_COST}/mo\` |
          | **Cost (diff)** | \`\$${COST_DIFF}/mo\` |
          | **Triggered by** | @${{ github.actor }} |

          ${STATUS_MSG}

          ${SECURITY_SUMMARY}

          ${{ needs.sast.outputs.sast_summary }}

          <details><summary>📋 Plan output (expand)</summary>

          \`\`\`hcl
          ${PLAN_OUTPUT}
          \`\`\`

          </details>

          ---
          > 🤖 This PR was auto-created by the CI pipeline. Review the plan above and approve to deploy.

          <!-- DEPLOYMENT_CONTEXT
          environment: ${ENV}
          account_id: ${{ inputs.account_id }}
          ou_name: ${{ inputs.ou_name }}
          working_directory: ${{ inputs.working_directory }}
          extra_vars: ${{ inputs.extra_vars }}
          secret_var_names: ${SECRET_VAR_NAMES} 
          plan_artifact_name: ${{ needs.plan.outputs.artifact_name }}
          plan_exitcode: ${EXITCODE}
          next_environment: ${NEXT_ENV}
          approval_teams: ${NEXT_APPROVAL_TEAMS}
          dev_account_id: ${{ inputs.dev_account_id }}
          qa_account_id: ${{ inputs.qa_account_id }}
          preprod_account_id: ${{ inputs.preprod_account_id }}
          prod_account_id: ${{ inputs.prod_account_id }}
          dr_enabled: ${{ inputs.dr_enabled }}
          feature_branch: ${{ inputs.feature_branch }}
          source_branch: ${SOURCE}
          target_branch: ${TARGET}
          region: ${REGION}
          commit_sha: ${{ github.sha }}
          ci_run_id: ${{ github.run_id }}
          monthly_cost: ${MONTHLY_COST}
          cost_diff: ${COST_DIFF}
          -->"

          SECRET_VAR_NAMES=""
          if [ -n '${{ inputs.secret_titles }}' ]; then
            SECRET_VAR_NAMES=$(echo '${{ inputs.secret_titles }}' \
              | jq -r '[.[].tf_var] | join(" ")' 2>/dev/null || echo "")
          fi
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list \
            --head "$SOURCE" \
            --base "$TARGET" \
            --state open \
            --json number,url \
            --jq '.[0]' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            # Update existing PR
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
            gh pr edit "$PR_NUMBER" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            echo "Updated existing PR #${PR_NUMBER}"
          else
            # Create new PR
            PR_URL=$(gh pr create \
              --head "$SOURCE" \
              --base "$TARGET" \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
            
            # Add labels (non-fatal if they don't exist)
            gh pr edit "$PR_NUMBER" --add-label "environment/${ENV}" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "terraform" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "needs-review" 2>/dev/null || true

            echo "Created new PR #${PR_NUMBER}"
          fi

          # Add production label if prod/dr
          if [ "$ENV" = "prod" ] || [ "$ENV" = "dr" ]; then
            gh pr edit "$PR_NUMBER" --add-label "production" 2>/dev/null || true
          fi

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      - name: PR Summary
        if: steps.pr.outputs.pr_number != ''
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ⑤ Pull Request
          | Field | Value |
          |-------|-------|
          | PR | [#${{ steps.pr.outputs.pr_number }}](${{ steps.pr.outputs.pr_url }}) |
          | Source | \`${{ inputs.pr_source_branch }}\` |
          | Target | \`${{ inputs.pr_target_branch }}\` |
          | Environment | \`${{ inputs.environment }}\` |
          | Context metadata | ✅ Embedded |
          EOF
