# bin-transversales-devops/platform-orchestrator-automation-terraform
# .github/workflows/emergency-cluster-ops.yml
#
# Reusable EMERGENCY workflow — replace, recreate, or destroy a ROSA HCP cluster.
#
# ⚠️ DESTRUCTIVE. workflow_dispatch (via caller) ONLY. dev/qa ONLY (conservative).
#
# OPERATIONS:
#   - replace  : -replace a specific resource. When target is the cluster, the
#                workflow ALSO -replaces every rhcs_hcp_machine_pool in state,
#                because a ROSA HCP cluster replacement orphans its pools (the
#                pool 'cluster' attribute is IMMUTABLE → update-in-place fails).
#   - recreate : full destroy + apply. The CLEANEST way to recreate a cluster
#                (no orphaned pools, no half-applied state). Preferred for
#                immutable-field changes (pod_cidr, service_cidr, machine_cidr).
#   - destroy  : tear down the whole component (failed/partial install cleanup).
#
# ── IMPORTANT: runs against the CALLER REPO's DEFAULT BRANCH (master) ──
# Unlike CI/CD (which uses the PR commit), this workflow checks out master.
# Any config change (e.g. pod_cidr) MUST be committed+pushed to master BEFORE
# running, or the operation uses STALE code. (This bit us on int-dev once.)
#
# GUARDRAILS:
#   - confirm_cluster_name must EXACTLY match the derived cluster name.
#   - environment restricted to dev|qa (regulated prod/dr blocked by design).
#   - GitHub Environment gate on the execute job.
#   - Pre-flight describe + full audit summary.
#
# JOBS:
#   ⓪ resolve   → derive region/bucket + echo target
#   ① guard     → validate confirm + tier + operation
#   ② preflight → show current state + warn about master-vs-PR
#   ③ execute   → replace (cluster+pools) | recreate (destroy+apply) | destroy
#   ④ audit     → always: write summary

name: "[reusable] 🔴 Emergency Cluster Ops"

on:
  workflow_call:
    inputs:
      # ─── Required ──────────────────────────────────────────────
      environment:
        description: "Target environment: dev | qa (regulated tiers blocked)."
        required: true
        type: string
      working_directory:
        description: "Path to the cluster Terragrunt component (caller-derived)."
        required: true
        type: string
      account_id:
        description: "AWS account ID for the target environment."
        required: true
        type: string
      ou_name:
        description: "OU / product name — root folder in state bucket."
        required: true
        type: string
      operation:
        description: "replace | recreate | destroy"
        required: true
        type: string
      cluster_name:
        description: "Derived cluster name (e.g. int-dev) — source of truth for the guard."
        required: true
        type: string
      confirm_cluster_name:
        description: "User-typed confirmation. MUST equal cluster_name or the run aborts."
        required: true
        type: string

      # ─── Optional ──────────────────────────────────────────────
      target_resource:
        description: "Resource to -replace (operation=replace only)."
        required: false
        type: string
        default: "rhcs_cluster_rosa_hcp.this"
      cluster_resource_address:
        description: "Terraform address of the cluster resource (used to detect a cluster-targeted replace so machine pools are co-replaced)."
        required: false
        type: string
        default: "rhcs_cluster_rosa_hcp.this"
      machine_pool_resource_prefix:
        description: "Address prefix that identifies machine pool resources in state."
        required: false
        type: string
        default: "rhcs_hcp_machine_pool.this"
      extra_vars:
        description: "Space-separated -var overrides (destroy/recreate re-evaluate vars)."
        required: false
        type: string
        default: ""
      target_role_name:
        description: "IAM role name to assume in target account."
        required: false
        type: string
        default: "terraform-apply-role"

    outputs:
      outcome:
        description: "success | failed | aborted"
        value: ${{ jobs.execute.outputs.outcome }}

# One destructive op per env/component at a time. NEVER cancel mid-flight.
concurrency:
  group: "tf-emergency-${{ inputs.environment }}-${{ inputs.ou_name }}"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  #  ⓪ RESOLVE
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve"
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    outputs:
      region:    ${{ steps.derive.outputs.region }}
      bucket:    ${{ steps.derive.outputs.bucket }}
      state_key: ${{ steps.derive.outputs.state_key }}
    steps:
      - name: Derive infrastructure context
        id: derive
        run: |
          ENV="${{ inputs.environment }}"
          REPO="${{ github.event.repository.name }}"
          OU="${{ inputs.ou_name }}"

          case "$ENV" in
            dev|qa)
              REGION="us-east-1"
              BUCKET="s3-aw-ue1-terraform-state-${ENV}"
              ;;
            *)
              echo "::error::❌ Emergency ops are restricted to dev|qa. Got '$ENV'."
              exit 1
              ;;
          esac

          STATE_KEY="${OU}/${REPO}/terraform.tfstate"

          echo "region=$REGION"       >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET"       >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ⓪ Emergency Context
          | Key | Value |
          |-----|-------|
          | Operation | \`${{ inputs.operation }}\` |
          | Environment | \`${ENV}\` |
          | Cluster | \`${{ inputs.cluster_name }}\` |
          | Region | \`${REGION}\` |
          | Bucket | \`${BUCKET}\` |
          | Directory | \`${{ inputs.working_directory }}\` |
          | Account ID | \`${{ inputs.account_id }}\` |
          | Triggered by | @${{ github.actor }} |
          EOF

  # ─────────────────────────────────────────────
  #  ① GUARD — confirmation + tier + operation validation
  # ─────────────────────────────────────────────
  guard:
    name: "① Guard"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    steps:
      - name: Validate operation
        run: |
          OP="${{ inputs.operation }}"
          case "$OP" in
            replace|recreate|destroy) echo "✅ operation '$OP' is valid." ;;
            *)
              echo "::error::❌ operation must be 'replace', 'recreate' or 'destroy'. Got '$OP'."
              exit 1
              ;;
          esac

      - name: Block regulated tiers (defense in depth)
        run: |
          ENV="${{ inputs.environment }}"
          case "$ENV" in
            preprod|prod|dr)
              echo "::error::🚫 '$ENV' is regulated (SB-2023-01901). Blocked in this workflow."
              echo "::error::Use the controlled manual process for regulated tiers."
              exit 1
              ;;
          esac
          echo "✅ '$ENV' is a non-regulated tier — allowed."

      - name: Confirm cluster name match
        run: |
          EXPECTED="${{ inputs.cluster_name }}"
          TYPED="${{ inputs.confirm_cluster_name }}"
          echo "Expected cluster : '$EXPECTED'"
          echo "Typed confirm    : '$TYPED'"
          if [ "$EXPECTED" != "$TYPED" ]; then
            echo "::error::❌ Confirmation mismatch. Typed '$TYPED' ≠ target '$EXPECTED'. ABORTING."
            exit 1
          fi
          echo "✅ Confirmation matches. Proceeding with ${{ inputs.operation }} on '$EXPECTED'."

      - name: Guard summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ① Guard: ✅ Passed
          | Check | Result |
          |-------|--------|
          | Operation valid | ✅ \`${{ inputs.operation }}\` |
          | Tier non-regulated | ✅ \`${{ inputs.environment }}\` |
          | Cluster confirmation | ✅ \`${{ inputs.cluster_name }}\` |
          EOF

  # ─────────────────────────────────────────────
  #  ② PRE-FLIGHT — show what will be affected + master warning
  # ─────────────────────────────────────────────
  preflight:
    name: "② Pre-flight"
    needs: [resolve, guard]
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    env:
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-emrg-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}

      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      - name: Master-vs-PR warning
        run: |
          echo "::warning::⚠️ This workflow runs against the DEFAULT BRANCH (master), NOT a PR."
          echo "::warning::Any config change (e.g. pod_cidr) MUST be committed to master first."
          echo "Current commit: ${{ github.sha }}"

      - name: Show current state
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          echo "── Resources currently in state ──"
          terragrunt state list || echo "(state empty or unreadable)"
          echo ""
          POOLS=$(terragrunt state list 2>/dev/null | grep "${{ inputs.machine_pool_resource_prefix }}" || true)
          if [ -n "$POOLS" ]; then
            echo "── Machine pools in state (relevant for replace/recreate) ──"
            echo "$POOLS"
          fi
          echo ""
          if [ "${{ inputs.operation }}" = "replace" ]; then
            echo "── Will REPLACE: ${{ inputs.target_resource }} (+ pools if target is the cluster) ──"
            terragrunt state show "${{ inputs.target_resource }}" 2>/dev/null | head -40 || \
              echo "::warning::Resource ${{ inputs.target_resource }} not found in state."
          elif [ "${{ inputs.operation }}" = "recreate" ]; then
            echo "── Will DESTROY the ENTIRE component, then APPLY from master ──"
          else
            echo "── Will DESTROY the ENTIRE component above ──"
          fi

  # ─────────────────────────────────────────────
  #  ③ EXECUTE — replace (cluster+pools) | recreate | destroy
  # ─────────────────────────────────────────────
  execute:
    name: "③ Execute"
    needs: [resolve, guard, preflight]
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    environment: ${{ inputs.environment }}
    outputs:
      outcome: ${{ steps.outcome.outputs.value }}
    env:
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}
      OP_FAILED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-emrg-exec-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}

      - name: Terragrunt init
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: terragrunt init -reconfigure

      # ── REPLACE (cluster-aware: also replaces machine pools) ────
      - name: "Replace"
        if: inputs.operation == 'replace'
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          TARGET="${{ inputs.target_resource }}"
          CLUSTER_ADDR="${{ inputs.cluster_resource_address }}"
          POOL_PREFIX="${{ inputs.machine_pool_resource_prefix }}"

          echo "🔁 Replace target: $TARGET"
          echo "   Cluster: ${{ inputs.cluster_name }}  (${{ inputs.environment }})"
          echo ""

          # Base -replace flag for the requested target.
          REPLACE_FLAGS="-replace=\"$TARGET\""

          # If the target IS the cluster, ALSO replace every machine pool —
          # a cluster replacement orphans pools (pool.cluster is immutable, so
          # an update-in-place fails). Replacing them together recreates pools
          # against the NEW cluster id.
          if [ "$TARGET" = "$CLUSTER_ADDR" ]; then
            echo "🔎 Target is the cluster → detecting machine pools to co-replace..."
            POOLS=$(terragrunt state list 2>/dev/null | grep "^${POOL_PREFIX}" || true)
            if [ -n "$POOLS" ]; then
              while IFS= read -r pool; do
                [ -z "$pool" ] && continue
                echo "   + co-replace pool: $pool"
                REPLACE_FLAGS="$REPLACE_FLAGS -replace=\"$pool\""
              done <<< "$POOLS"
            else
              echo "   (no machine pools in state — cluster-only replace)"
            fi
          fi

          echo ""
          echo "Effective: terragrunt apply $REPLACE_FLAGS"
          echo ""

          SECONDS=0
          set +e
          eval terragrunt apply $REPLACE_FLAGS -input=false -auto-approve 2>&1 | tee op_output.txt
          CODE=$?
          echo "duration=${SECONDS}s"
          if [ $CODE -ne 0 ]; then
            echo "OP_FAILED=true" >> $GITHUB_ENV
            echo "::error::❌ replace failed (exit $CODE) after ${SECONDS}s."
          else
            echo "✅ replace completed in ${SECONDS}s."
          fi
          exit 0

      # ── RECREATE (destroy + apply) — cleanest for immutable changes ──
      - name: "Recreate (destroy + apply)"
        if: inputs.operation == 'recreate'
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          echo "♻️  Recreate (destroy + apply): ${{ inputs.cluster_name }}  (${{ inputs.environment }})"
          echo "   Fully destroys the component, then recreates it from master."
          echo ""

          EXTRA_VAR_FLAGS=""
          if [ -n "${{ inputs.extra_vars }}" ]; then
            for pair in ${{ inputs.extra_vars }}; do
              EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
            done
          fi

          SECONDS=0
          set +e

          echo "── Phase 1: destroy ──"
          eval terragrunt destroy $EXTRA_VAR_FLAGS -input=false -auto-approve 2>&1 | tee destroy_output.txt
          DCODE=$?
          if [ $DCODE -ne 0 ]; then
            echo "OP_FAILED=true" >> $GITHUB_ENV
            echo "::error::❌ recreate: destroy phase failed (exit $DCODE) after ${SECONDS}s."
            echo "::error::State: s3://${{ needs.resolve.outputs.bucket }}/${{ needs.resolve.outputs.state_key }}"
            exit 0
          fi
          echo "✅ destroy phase complete (${SECONDS}s). State is clean."
          echo ""

          echo "── Phase 2: apply ──"
          eval terragrunt apply $EXTRA_VAR_FLAGS -input=false -auto-approve 2>&1 | tee apply_output.txt
          ACODE=$?
          echo "duration=${SECONDS}s"
          if [ $ACODE -ne 0 ]; then
            echo "OP_FAILED=true" >> $GITHUB_ENV
            echo "::error::❌ recreate: apply phase failed (exit $ACODE) after ${SECONDS}s."
            echo "::error::Component is DESTROYED but not recreated. Re-run apply/CD to finish."
          else
            echo "✅ recreate complete in ${SECONDS}s (destroy + apply)."
          fi
          exit 0

      # ── DESTROY ─────────────────────────────────────────────────
      - name: "Destroy"
        if: inputs.operation == 'destroy'
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          echo "💥 Destroying component: ${{ inputs.working_directory }}"
          echo "   Cluster: ${{ inputs.cluster_name }}  (${{ inputs.environment }})"
          echo ""
          EXTRA_VAR_FLAGS=""
          if [ -n "${{ inputs.extra_vars }}" ]; then
            for pair in ${{ inputs.extra_vars }}; do
              EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
            done
          fi
          SECONDS=0
          set +e
          eval terragrunt destroy $EXTRA_VAR_FLAGS -input=false -auto-approve 2>&1 | tee op_output.txt
          CODE=$?
          echo "duration=${SECONDS}s"
          if [ $CODE -ne 0 ]; then
            echo "OP_FAILED=true" >> $GITHUB_ENV
            echo "::error::❌ destroy failed (exit $CODE) after ${SECONDS}s."
            echo "::error::State: s3://${{ needs.resolve.outputs.bucket }}/${{ needs.resolve.outputs.state_key }}"
          else
            echo "✅ destroy completed in ${SECONDS}s. State is clean."
          fi
          exit 0

      - name: Set outcome
        id: outcome
        if: always()
        run: |
          if [ "$OP_FAILED" = "true" ]; then
            echo "value=failed" >> $GITHUB_OUTPUT
          else
            echo "value=success" >> $GITHUB_OUTPUT
          fi

      - name: Fail job on error
        if: env.OP_FAILED == 'true'
        run: exit 1

  # ─────────────────────────────────────────────
  #  ④ AUDIT — always summarize (regulatory trace)
  # ─────────────────────────────────────────────
  audit:
    name: "④ Audit"
    needs: [resolve, guard, preflight, execute]
    if: always()
    runs-on: [self-hosted, terraform, "${{ inputs.environment }}"]
    steps:
      - name: Write audit summary
        run: |
          OUTCOME="${{ needs.execute.outputs.outcome }}"
          [ -z "$OUTCOME" ] && OUTCOME="aborted"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ④ Emergency Op — Audit
          | Field | Value |
          |-------|-------|
          | **Operation** | \`${{ inputs.operation }}\` |
          | **Cluster** | \`${{ inputs.cluster_name }}\` |
          | **Environment** | \`${{ inputs.environment }}\` |
          | **Target resource** | \`${{ inputs.target_resource }}\` |
          | **Outcome** | \`${OUTCOME}\` |
          | **Account** | \`${{ inputs.account_id }}\` |
          | **Commit (master)** | \`${{ github.sha }}\` |
          | **State** | \`s3://${{ needs.resolve.outputs.bucket }}/${{ needs.resolve.outputs.state_key }}\` |
          | **Triggered by** | @${{ github.actor }} |
          | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF
