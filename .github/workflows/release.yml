# .github/workflows/release.yml
#
# Creates a versioned release of the platform-orchestrator-automation-terraform repo.
# Triggered manually with a semver version input.
#
# Steps:
#   1. Validates all modules pass `terraform validate`
#   2. Creates a git tag (e.g. v2.2.0)
#   3. Creates a GitHub Release with auto-generated changelog
#
# Usage: Actions → Release → Run workflow → Enter version (e.g. 2.2.0)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (e.g. 2.2.0 — without 'v' prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-modules:
    name: Validate all Terraform modules
    runs-on: [self-hosted, linux, terraform]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be valid semver (e.g. 2.2.0). Got: $VERSION"
            exit 1
          fi
          echo "VERSION=v${VERSION}" >> "$GITHUB_ENV"

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Terraform validate — all modules
        run: |
          set -euo pipefail
          FAILED=0
          for dir in $(find modules -mindepth 2 -maxdepth 3 -name "*.tf" -printf '%h\n' | sort -u); do
            echo "── Validating: $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null 2>&1
            if ! terraform -chdir="$dir" validate; then
              echo "::error::Validation failed for $dir"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more modules failed validation."
            exit 1
          fi
          echo "✅ All modules passed terraform validate"

  release:
    name: Create tag and GitHub Release
    needs: validate-modules
    runs-on: [self-hosted, linux, terraform]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG="v${{ inputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ inputs.version }}`;
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
            core.notice(`Release created: ${release.html_url}`);
