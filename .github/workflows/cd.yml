# ORG-DEVOPS/.github/workflows/cd.yml
#
# Reusable CD workflow — ADR-009: terragrunt run-all apply
#
# Downloads exact plan artifact from CI (same SHA). No re-plan.
# AUTO-DETECTS multi-component: uses run-all apply with --terragrunt-out-dir
#
# JOBS:
#   ⓪ resolve   → derives region, bucket
#   ① apply     → terragrunt [run-all] apply
#   ② promote   → creates promotion issue for next environment

name: "[reusable] Terraform CD"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: dev, qa, preprod, prod, dr"
        required: true
        type: string
      working_directory:
        description: "Path to Terragrunt environment."
        required: true
        type: string
      account_id:
        description: "AWS account ID for the target environment."
        required: true
        type: string
      ou_name:
        description: "OU / product name."
        required: true
        type: string
      plan_artifact_name:
        description: "Artifact name from CI containing plan(s)."
        required: true
        type: string
      plan_exitcode:
        description: "Exit code from CI plan. 0=no changes, 2=changes."
        required: true
        type: string
      ci_run_id:
        description: "Workflow run ID from CI."
        required: false
        type: string
        default: ""


      # ─── Optional inputs ───────────────────────────────────────
      runner_label:
        description: "Override the runner tag."
        required: false
        type: string
        default: ""
      extra_vars:
        description: "Space-separated Terraform -var overrides (for rollback destroy)."
        required: false
        type: string
        default: ""
      target_role_name:
        description: "IAM role name to assume."
        required: false
        type: string
        default: "terraform-apply-role"
      is_multi_component:
        description: "Whether this is a multi-component run-all deployment."
        required: false
        type: string
        default: "false"

      # ─── Promotion inputs ──────────────────────────────────────
      promote_on_success:
        description: "Create promotion issue after success."
        required: false
        type: boolean
        default: true
      next_environment:
        description: "Target environment for promotion."
        required: false
        type: string
        default: ""
      approval_teams:
        description: "Comma-separated GitHub teams for approval."
        required: false
        type: string
        default: ""

      # ─── Port.io log streaming ────────────────────────────────
      port_run_id:
        description: "Port.io action run ID for log streaming. If empty, logs are skipped."
        required: false
        type: string
        default: ""
      port_client_id:
        description: "Port.io client ID (pass from vars.PORT_CLIENT_ID of the calling repo)."
        required: false
        type: string
        default: ""
      port_base_url:
        description: "Port.io API base URL (pass from vars.PORT_API_BASE_URL of the calling repo)."
        required: false
        type: string
        default: "https://api.us.getport.io"

      # ─── Context for promotion ─────────────────────────────────
      dev_account_id:
        description: "DEV account ID."
        required: false
        type: string
        default: ""
      qa_account_id:
        description: "QA account ID."
        required: false
        type: string
        default: ""
      preprod_account_id:
        description: "PREPROD account ID."
        required: false
        type: string
        default: ""
      prod_account_id:
        description: "PROD account ID."
        required: false
        type: string
        default: ""
      dr_enabled:
        description: "Whether DR is enabled."
        required: false
        type: boolean
        default: false
      feature_branch:
        description: "Original feature branch."
        required: false
        type: string
        default: ""

    outputs:
      apply_outcome:
        description: "success | skipped | rolled_back | failed"
        value: ${{ jobs.apply.outputs.outcome }}
      promotion_issue_number:
        description: "Issue number if created."
        value: ${{ jobs.promote.outputs.issue_number }}
      promotion_issue_url:
        description: "Issue URL if created."
        value: ${{ jobs.promote.outputs.issue_url }}

concurrency:
  group: "tf-cd-${{ inputs.environment }}-${{ inputs.ou_name }}"
  cancel-in-progress: false


jobs:
  # ─────────────────────────────────────────────
  #  ⓪ RESOLVE
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve"
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    outputs:
      region: ${{ steps.derive.outputs.region }}

    steps:
      - name: Derive context
        id: derive
        run: |
          ENV="${{ inputs.environment }}"
          case "$ENV" in
            dev|qa|preprod|prod) REGION="us-east-1" ;;
            dr)                  REGION="us-east-2" ;;
            *) echo "::error::Invalid environment: '$ENV'."; exit 1 ;;
          esac
          echo "region=$REGION" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  #  ① APPLY
  # ─────────────────────────────────────────────
  apply:
    name: "① Apply"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]
    environment: ${{ inputs.environment }}

    outputs:
      outcome: ${{ steps.outcome.outputs.value }}

    env:
      OU_NAME: ${{ inputs.ou_name }}
      TF_VAR_aws_account_id: ${{ inputs.account_id }}
      APPLY_FAILED: "false"
      RHCS_TOKEN: ${{ secrets.RHCS_TOKEN }}

    steps:
      - name: "Skip — no changes"
        if: inputs.plan_exitcode == '0'
        run: echo "::notice::No changes — apply skipped."

      # ── Change window (prod only) ──────────────────────────────
      - name: Change window check
        if: inputs.plan_exitcode != '0' && inputs.environment == 'prod'
        run: |
          HOUR_UTC=$(date -u +%H)
          MIN_UTC=$(date -u +%M)
          DAY=$(date -u +%u)
          NOW_MIN=$((10#$HOUR_UTC * 60 + 10#$MIN_UTC))
          BLOCK_START=$((13 * 60 + 30))
          BLOCK_END=$((22 * 60 + 30))
          if [[ $DAY -ge 6 ]]; then
            echo "Weekend — deploy allowed."
          elif [[ $NOW_MIN -ge $BLOCK_START && $NOW_MIN -lt $BLOCK_END ]]; then
            echo "::error::Deploys blocked during Ecuador business hours."
            exit 1
          else
            echo "Outside business hours. Deploy allowed."
          fi


      - name: Checkout
        if: inputs.plan_exitcode != '0'
        uses: actions/checkout@v4

      - name: Assume role in target account
        if: inputs.plan_exitcode != '0'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ needs.resolve.outputs.region }}
          role-session-name: "tf-cd-${{ inputs.environment }}-${{ github.run_id }}"
          role-external-id: ${{ secrets.ROLE_EXTERNAL_ID }}

      - name: Configure git for private modules
        if: inputs.plan_exitcode != '0'
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}

      - name: Download plan artifact
        if: inputs.plan_exitcode != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          rm -rf /tmp/plan-download
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            gh run download "${{ inputs.ci_run_id }}" \
              --name "${{ inputs.plan_artifact_name }}" \
              --dir "/tmp/plan-download" \
              --repo "${{ github.repository }}"
          else
            echo "::error::ci_run_id is required to download artifacts."
            exit 1
          fi

      - name: Restore plans to working directory
        if: inputs.plan_exitcode != '0'
        run: |
          WORK_DIR="${{ inputs.working_directory }}"
          # The artifact has plans/ directory and plan_output.txt
          if [ -d "/tmp/plan-download/plans" ]; then
            cp -r /tmp/plan-download/plans "${WORK_DIR}/plans"
          fi

      # ─── Port.io log: apply starting ───
      - name: Log to Port — Apply starting
        if: inputs.port_run_id != '' && inputs.plan_exitcode != '0'
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')
          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"message": "Ejecutando terraform apply en ${{ inputs.environment }}..."}'

      - name: Terragrunt apply
        id: apply
        if: inputs.plan_exitcode != '0'
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          IS_MULTI="${{ inputs.is_multi_component }}"
          PLAN_DIR="$(pwd)/plans"

          # Auto-detect multi-component if not explicitly set
          if [ "$IS_MULTI" != "true" ]; then
            if find . -mindepth 2 -name "terragrunt.hcl" 2>/dev/null | grep -q .; then
              IS_MULTI="true"
              echo "::notice::Auto-detected multi-component directory (overriding is_multi_component=false)"
            fi
          fi

          echo "Applying saved plan: ${{ inputs.plan_artifact_name }}"
          SECONDS=0
          set +e

          if [ "$IS_MULTI" = "true" ]; then
            # ── MULTI-COMPONENT: terragrunt run-all apply ──
            echo "══════════════════════════════════════════════"
            echo "  MODE: terragrunt run-all apply"
            echo "══════════════════════════════════════════════"
            terragrunt run-all apply \
              --terragrunt-non-interactive \
              --terragrunt-out-dir "$PLAN_DIR" \
              -input=false \
              -auto-approve \
              2>&1 | tee /tmp/apply_output.txt
            CODE=$?
          else
            # ── SINGLE-COMPONENT: standard apply ──
            echo "══════════════════════════════════════════════"
            echo "  MODE: terragrunt apply (single component)"
            echo "══════════════════════════════════════════════"
            terragrunt apply \
              -input=false \
              -auto-approve \
              "${PLAN_DIR}/tfplan" \
              2>&1 | tee /tmp/apply_output.txt
            CODE=$?
          fi

          DURATION=$SECONDS
          set -e

          echo "apply_duration=${DURATION}s" >> $GITHUB_OUTPUT

          if [ $CODE -ne 0 ]; then
            echo "APPLY_FAILED=true" >> $GITHUB_ENV
            echo "::error::Apply failed (exit $CODE) after ${DURATION}s."
          else
            echo "Apply completed successfully in ${DURATION}s."
          fi
          exit 0


      # ── Rollback: auto-destroy (dev/qa) ─────────────────────────
      - name: "Rollback — auto-destroy (dev/qa)"
        if: |
          env.APPLY_FAILED == 'true' &&
          (inputs.environment == 'dev' || inputs.environment == 'qa')
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
        run: |
          echo "::warning::Apply failed. Running automatic rollback (destroy)."
          EXTRA_VAR_FLAGS=""
          if [ -n "${{ inputs.extra_vars }}" ]; then
            for pair in ${{ inputs.extra_vars }}; do
              EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
            done
          fi

          IS_MULTI="${{ inputs.is_multi_component }}"
          set +e
          if [ "$IS_MULTI" = "true" ]; then
            eval terragrunt run-all destroy $EXTRA_VAR_FLAGS --terragrunt-non-interactive -input=false -auto-approve 2>&1 | tail -20
          else
            eval terragrunt destroy $EXTRA_VAR_FLAGS -input=false -auto-approve 2>&1 | tail -20
          fi
          ROLLBACK_CODE=$?
          set -e

          if [ $ROLLBACK_CODE -ne 0 ]; then
            echo "::error::Rollback ALSO FAILED. Manual intervention required."
          else
            echo "Rollback (destroy) completed."
          fi

      # ── Rollback: alert only (preprod/prod/dr) ──────────────────
      - name: "Rollback — alert only (preprod/prod/dr)"
        if: |
          env.APPLY_FAILED == 'true' &&
          (inputs.environment == 'preprod' || inputs.environment == 'prod' || inputs.environment == 'dr')
        run: |
          echo "::error::Apply failed in '${{ inputs.environment }}'. No auto-destroy for production."
          echo "::error::Manual fix-forward or destroy required."

      - name: Set outcome
        id: outcome
        if: always()
        run: |
          if [ "${{ inputs.plan_exitcode }}" = "0" ]; then
            echo "value=skipped" >> $GITHUB_OUTPUT
          elif [ "$APPLY_FAILED" = "true" ]; then
            echo "value=failed" >> $GITHUB_OUTPUT
          else
            echo "value=success" >> $GITHUB_OUTPUT
          fi

      # ─── Port.io log: apply result with full terraform output ───
      - name: Log to Port — Apply result
        if: always() && inputs.port_run_id != '' && inputs.plan_exitcode != '0'
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')

          OUTCOME="${{ steps.outcome.outputs.value }}"
          DURATION="${{ steps.apply.outputs.apply_duration }}"

          # ── Build header message ──
          if [ "$OUTCOME" = "success" ]; then
            HEADER="Apply exitoso en ${{ inputs.environment }} (${DURATION})"
          elif [ "$OUTCOME" = "failed" ]; then
            HEADER="Apply FALLIDO en ${{ inputs.environment }} (${DURATION})"
          else
            HEADER="Apply omitido: sin cambios de infraestructura."
          fi

          # Send header log
          jq -n --arg msg "$HEADER" '{"message": $msg}' | \
            curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d @-

          # ── Send full terraform output (truncated to 50KB) ──
          if [ -f /tmp/apply_output.txt ] && [ -s /tmp/apply_output.txt ]; then
            # Truncate to 50KB to stay well under Port's 1MiB limit
            APPLY_OUTPUT=$(head -c 51200 /tmp/apply_output.txt)
            if [ $(wc -c < /tmp/apply_output.txt) -gt 51200 ]; then
              APPLY_OUTPUT="${APPLY_OUTPUT}
          ... (output truncado a 50KB)"
            fi

            # Use jq for proper JSON escaping of multiline terraform output
            jq -n --arg msg "$APPLY_OUTPUT" '{"message": $msg}' | \
              curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d @-
          fi

      - name: Fail job on apply error
        if: env.APPLY_FAILED == 'true'
        run: exit 1


  # ─────────────────────────────────────────────
  #  ② PROMOTION ISSUE
  # ─────────────────────────────────────────────
  promote:
    name: "② Promote"
    needs: [resolve, apply]
    if: |
      needs.apply.outputs.outcome == 'success' &&
      inputs.promote_on_success &&
      inputs.next_environment != ''
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      issue_url:    ${{ steps.create_issue.outputs.issue_url }}

    steps:
      - name: Create promotion issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ENV="${{ inputs.environment }}"
          NEXT_ENV="${{ inputs.next_environment }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          APPROVAL_TEAMS="${{ inputs.approval_teams }}"

          # Determine next account_id
          case "$NEXT_ENV" in
            qa)      NEXT_ACCOUNT_ID="${{ inputs.qa_account_id }}" ;;
            preprod) NEXT_ACCOUNT_ID="${{ inputs.preprod_account_id }}" ;;
            prod)    NEXT_ACCOUNT_ID="${{ inputs.prod_account_id }}" ;;
            *)       NEXT_ACCOUNT_ID="" ;;
          esac

          PROMOTION_LABEL="promotion/${ENV}-to-${NEXT_ENV}"

          ISSUE_BODY="## Deployment Validation

          | Field | Value |
          |-------|-------|
          | **Source env** | \`${ENV}\` |
          | **Target env** | \`${NEXT_ENV}\` |
          | **Commit** | \`${SHORT_SHA}\` |
          | **CD Run** | [View]($RUN_URL) |
          | **Triggered by** | @${{ github.actor }} |

          ---
          Add label \`approved-for-${NEXT_ENV}\` to trigger promotion.

          <!-- PROMOTION_METADATA
          source_env: ${ENV}
          target_env: ${NEXT_ENV}
          account_id: ${NEXT_ACCOUNT_ID}
          ou_name: ${{ inputs.ou_name }}
          working_directory: ${{ inputs.working_directory }}
          feature_branch: ${{ inputs.feature_branch }}
          dev_account_id: ${{ inputs.dev_account_id }}
          qa_account_id: ${{ inputs.qa_account_id }}
          preprod_account_id: ${{ inputs.preprod_account_id }}
          prod_account_id: ${{ inputs.prod_account_id }}
          dr_enabled: ${{ inputs.dr_enabled }}
          -->"

          ISSUE_URL=$(gh issue create \
            --title "[${ENV^^}] Validate & Promote → ${NEXT_ENV} — ${SHORT_SHA}" \
            --body "$ISSUE_BODY" \
            --label "awaiting-validation" \
            --label "$PROMOTION_LABEL" \
            --label "environment/${ENV}")

          ISSUE_NUMBER=$(gh issue view "$ISSUE_URL" --json number --jq '.number')
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
          echo "issue_url=${ISSUE_URL}" >> $GITHUB_OUTPUT
          echo "Created promotion issue #${ISSUE_NUMBER}"

      # ─── Port.io log: promotion issue created ───
      - name: Log to Port — Promotion issue created
        if: inputs.port_run_id != '' && steps.create_issue.outputs.issue_number != ''
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')
          ISSUE_URL="${{ steps.create_issue.outputs.issue_url }}"
          NEXT_ENV="${{ inputs.next_environment }}"
          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"Promotion issue creado: ${ISSUE_URL}. Aprueba con label approved-for-${NEXT_ENV} para promover.\", \"terminationStatus\": \"SUCCESS\", \"statusLabel\": \"Desplegado en ${{ inputs.environment }}\"}"

  # ─────────────────────────────────────────────
  #  ③ REPORT FAILURE — close Port run on apply error
  # ─────────────────────────────────────────────
  report-failure:
    name: "③ Report Failure to Port"
    needs: [apply]
    if: |
      always() &&
      needs.apply.outputs.outcome == 'failed' &&
      inputs.port_run_id != ''
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    steps:
      - name: Close Port run with FAILURE
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')
          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"Apply fallido en ${{ inputs.environment }}. Revisa los logs de GitHub Actions.\", \"terminationStatus\": \"FAILURE\", \"statusLabel\": \"Apply fallido\"}"

  # ─────────────────────────────────────────────
  #  ④ REPORT SUCCESS (no promotion) — close Port run
  # ─────────────────────────────────────────────
  report-success-no-promote:
    name: "④ Report Success (no promote)"
    needs: [apply, promote]
    if: |
      always() &&
      needs.apply.outputs.outcome == 'success' &&
      (needs.promote.result == 'skipped' || needs.promote.outputs.issue_number == '') &&
      inputs.port_run_id != ''
    runs-on: [self-hosted, terraform, "${{ inputs.runner_label || inputs.environment }}"]

    steps:
      - name: Close Port run with SUCCESS (no promotion needed)
        env:
          PORT_CLIENT_ID: ${{ inputs.port_client_id }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          PORT_API_BASE_URL: ${{ inputs.port_base_url }}
        run: |
          PORT_API_BASE_URL="${PORT_API_BASE_URL%/}"
          TOKEN=$(curl -sSfL -X POST "${PORT_API_BASE_URL}/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${PORT_CLIENT_ID}\",\"clientSecret\":\"${PORT_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')
          curl -sSL -X POST "${PORT_API_BASE_URL}/v1/actions/runs/${{ inputs.port_run_id }}/logs" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"Apply exitoso en ${{ inputs.environment }}. Despliegue completado.\", \"terminationStatus\": \"SUCCESS\", \"statusLabel\": \"Desplegado en ${{ inputs.environment }}\"}"
