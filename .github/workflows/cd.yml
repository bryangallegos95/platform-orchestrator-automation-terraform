# ORG-DEVOPS/.github/workflows/cd.yml
#
# Reusable CD workflow — triggered on push to environment branches.
#
# DYNAMIC RESOLUTION (same logic as ci.yml):
#   github.ref_name → environment → runner label + state bucket
#   ou_name + repo_name → state key
#   account_id → assume-role ARN
#
# DYNAMIC VARS (extra_vars input):
#   Son repos pass tgw_id, service, ambiente as -var flags so they
#   never need to be hardcoded in terraform.tfvars.
#   Format: "key1=value1 key2=value2"
#
# KEY BEHAVIORS:
#   - Downloads exact plan artifact from CI (same SHA). No re-plan.
#   - plan_exitcode=0 → apply skipped entirely.
#   - Apply failure → auto destroy (dev/qa) or alert-only (preprod/prod).
#   - One apply per environment at a time (concurrency queue).

name: "[reusable] Terraform CD"

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      account_id:
        description: "AWS account ID. Provided by Port."
        required: true
        type: string
      ou_name:
        description: "OU / product name. Provided by Port. E.g. nuevosnegocios"
        required: true
        type: string
      plan_artifact_name:
        description: "Exact artifact name from ci.yml output."
        required: true
        type: string
      plan_exitcode:
        description: "Exit code from CI plan. 0=no changes → skip apply."
        required: true
        type: string
      extra_vars:
        description: |
          Optional space-separated list of Terraform -var overrides.
          Must match exactly what was passed to ci.yml so the saved plan is valid.
          Format: "key1=value1 key2=value2"
          Example: "tgw_id=tgw-0abc1234 service=datosanalitica ambiente=dev"
        required: false
        type: string
        default: ""
      terraform_version:
        required: false
        type: string
        default: "1.10.5"
      target_role_name:
        required: false
        type: string
        default: "terraform-apply-role"
      aws_region:
        required: false
        type: string
        default: "us-east-1"
      bucket_prefix:
        required: false
        type: string
        default: "s3-aw-ue1-terraform-state"
      change_window_start_utc:
        description: "Change window open hour UTC. Default 12 = 07:00 ECT."
        required: false
        type: string
        default: "12"
      change_window_end_utc:
        description: "Change window close hour UTC. Default 22 = 17:00 ECT."
        required: false
        type: string
        default: "22"

    outputs:
      apply_outcome:
        description: "success | skipped | rolled_back | failed"
        value: ${{ jobs.apply.outputs.outcome }}

concurrency:
  group: "tf-cd-${{ github.ref_name }}-${{ inputs.ou_name }}"
  cancel-in-progress: false   # queue — never cancel a running apply

jobs:
  # ─────────────────────────────────────────────
  #  RESOLVE
  #  Same derivation logic as CI.
  #  CD runs on push, so we use github.ref_name.
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve environment"
    runs-on: [self-hosted, terraform]

    outputs:
      environment:  ${{ steps.derive.outputs.environment }}
      bucket:       ${{ steps.derive.outputs.bucket }}
      state_key:    ${{ steps.derive.outputs.state_key }}
      runner_label: ${{ steps.derive.outputs.runner_label }}

    steps:
      - name: Derive environment from branch
        id: derive
        run: |
          BRANCH="${{ github.ref_name }}"
          REPO="${{ github.event.repository.name }}"
          OU="${{ inputs.ou_name }}"
          PREFIX="${{ inputs.bucket_prefix }}"

          case "$BRANCH" in
            dev)     ENV="dev"     ;;
            qa)      ENV="qa"      ;;
            preprod) ENV="preprod" ;;
            prod)    ENV="prod"    ;;
            dr)      ENV="dr"      ;;
            *)
              echo "::error::Branch '$BRANCH' does not map to a known environment."
              exit 1
              ;;
          esac

          BUCKET="${PREFIX}-${ENV}"
          STATE_KEY="${OU}/${REPO}/terraform.tfstate"

          echo "environment=$ENV"     >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET"       >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT
          echo "runner_label=$ENV"    >> $GITHUB_OUTPUT

          echo "### ⓪ Resolved values"                             >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"                                    >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"                                           >> $GITHUB_STEP_SUMMARY
          echo "| Branch      | \`$BRANCH\`                    |"  >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`$ENV\`                       |"  >> $GITHUB_STEP_SUMMARY
          echo "| Bucket      | \`$BUCKET\`                    |"  >> $GITHUB_STEP_SUMMARY
          echo "| State key   | \`$STATE_KEY\`                 |"  >> $GITHUB_STEP_SUMMARY
          echo "| Account ID  | \`${{ inputs.account_id }}\`   |"  >> $GITHUB_STEP_SUMMARY
          echo "| Extra vars  | \`${{ inputs.extra_vars }}\`   |"  >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  #  APPLY
  # ─────────────────────────────────────────────
  apply:
    name: "Terraform apply"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]
    environment: ${{ needs.resolve.outputs.environment }}
    # ↑ GitHub Environment protection rules enforce approval for qa/preprod/prod.

    outputs:
      outcome: ${{ steps.outcome.outputs.value }}

    env:
      APPLY_FAILED: "false"
      ROLLBACK_OUTCOME: "n/a"

    steps:
      # ── 0. Skip guard ────────────────────────────────────────────────
      - name: "Skip — no changes"
        if: inputs.plan_exitcode == '0'
        run: |
          echo "::notice::Plan exitcode=0. Apply skipped for '${{ needs.resolve.outputs.environment }}'."

      # ── 1. Change window (prod only) ─────────────────────────────────
      - name: Change window check
        if: |
          inputs.plan_exitcode != '0' &&
          needs.resolve.outputs.environment == 'prod'
        run: |
          HOUR=$(date -u +%H)
          DAY=$(date -u +%u)
          START=${{ inputs.change_window_start_utc }}
          END=${{ inputs.change_window_end_utc }}
          echo "UTC now: $(date -u)  |  Window: Mon–Fri ${START}:00–${END}:00 UTC"
          if [[ $DAY -ge 6 ]]; then
            echo "::error::❌ Weekend deployments to prod are not allowed."
            exit 1
          fi
          if [[ $HOUR -lt $START || $HOUR -ge $END ]]; then
            echo "::error::❌ Outside change window (${HOUR}:xx UTC). Window: ${START}:00–${END}:00 UTC."
            exit 1
          fi
          echo "✅ Within change window."

      # ── 2. Checkout ──────────────────────────────────────────────────
      - name: Checkout
        if: inputs.plan_exitcode != '0'
        uses: actions/checkout@v4

      # ── 3. Setup Terraform ───────────────────────────────────────────
      - name: Setup Terraform
        if: inputs.plan_exitcode != '0'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      # ── 4. Assume role: IRSA pivot → target account ──────────────────
      - name: Assume role in target account
        if: inputs.plan_exitcode != '0'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ inputs.aws_region }}
          role-session-name: "tf-cd-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}"

      # ── 5. Init ──────────────────────────────────────────────────────
      - name: Terraform init
        if: inputs.plan_exitcode != '0'
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.resolve.outputs.bucket }}" \
            -backend-config="key=${{ needs.resolve.outputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -input=false \
            -reconfigure

      # ── 6. Download saved plan from CI ───────────────────────────────
      - name: Download plan artifact
        if: inputs.plan_exitcode != '0'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ inputs.working_directory }}

      # ── 7. Apply ─────────────────────────────────────────────────────
      # NOTE: We apply the saved tfplan binary — no -var flags needed here.
      # The plan already has all variable values baked in from the CI step.
      - name: Terraform apply
        id: apply
        if: inputs.plan_exitcode != '0'
        working-directory: ${{ inputs.working_directory }}
        run: |
          set +e
          terraform apply -input=false -auto-approve tfplan
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "APPLY_FAILED=true" >> $GITHUB_ENV
            echo "::error::❌ terraform apply failed (exit $CODE)."
          fi
          exit 0   # let rollback steps always run

      # ── 8a. Rollback — auto destroy (dev / qa) ────────────────────────
      - name: "Rollback — auto destroy (dev/qa)"
        if: |
          env.APPLY_FAILED == 'true' &&
          (needs.resolve.outputs.environment == 'dev' ||
           needs.resolve.outputs.environment == 'qa')
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "::warning::⚠️ Apply failed. Running automatic rollback."
          echo "Resources in state:"
          terraform state list || true
          set +e

          # Build -var flags for destroy (same vars used in plan).
          EXTRA_VAR_FLAGS=""
          for pair in ${{ inputs.extra_vars }}; do
            EXTRA_VAR_FLAGS="$EXTRA_VAR_FLAGS -var=\"$pair\""
          done

          eval terraform destroy \
            -var-file=terraform.tfvars \
            $EXTRA_VAR_FLAGS \
            -input=false -auto-approve
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "ROLLBACK_OUTCOME=failed" >> $GITHUB_ENV
            echo "::error::❌ Rollback also failed. Manual intervention required."
            echo "::error::State: s3://${{ needs.resolve.outputs.bucket }}/${{ needs.resolve.outputs.state_key }}"
          else
            echo "ROLLBACK_OUTCOME=success" >> $GITHUB_ENV
            echo "✅ Rollback complete."
          fi

      # ── 8b. Rollback — alert only (preprod / prod) ───────────────────
      - name: "Rollback — alert only (preprod/prod)"
        if: |
          env.APPLY_FAILED == 'true' &&
          (needs.resolve.outputs.environment == 'preprod' ||
           needs.resolve.outputs.environment == 'prod')
        run: |
          echo "ROLLBACK_OUTCOME=blocked" >> $GITHUB_ENV
          echo "::error::❌ Apply failed in '${{ needs.resolve.outputs.environment }}'."
          echo "::error::Automatic destroy DISABLED for production-tier environments."
          echo "::error::ACTION REQUIRED:"
          echo "::error::  A) Fix-forward — push a corrected PR."
          echo "::error::  B) Manual destroy — run terraform destroy with your credentials."
          echo "::error::State: s3://${{ needs.resolve.outputs.bucket }}/${{ needs.resolve.outputs.state_key }}"

      # ── 9. Job summary ────────────────────────────────────────────────
      - name: Write job summary
        if: always() && inputs.plan_exitcode != '0'
        run: |
          case "$APPLY_FAILED-$ROLLBACK_OUTCOME" in
            "false-n/a")      STATUS="✅ Success";                       OUTCOME="success"     ;;
            "true-success")   STATUS="🔄 Failed → rolled back";          OUTCOME="rolled_back" ;;
            "true-failed")    STATUS="💥 Failed → rollback failed";       OUTCOME="failed"      ;;
            "true-blocked")   STATUS="🚨 Failed → manual action required"; OUTCOME="failed"    ;;
            *)                STATUS="⚠️ Unknown";                        OUTCOME="failed"      ;;
          esac
          echo "OUTCOME=$OUTCOME" >> $GITHUB_ENV

          ENV="${{ needs.resolve.outputs.environment }}"
          BUCKET="${{ needs.resolve.outputs.bucket }}"
          KEY="${{ needs.resolve.outputs.state_key }}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Terraform CD — ${ENV}

          | Field | Value |
          |---|---|
          | **Status**       | ${STATUS} |
          | **Environment**  | \`${ENV}\` |
          | **Account ID**   | \`${{ inputs.account_id }}\` |
          | **Directory**    | \`${{ inputs.working_directory }}\` |
          | **State**        | \`s3://${BUCKET}/${KEY}\` |
          | **Extra vars**   | \`${{ inputs.extra_vars }}\` |
          | **Plan artifact**| \`${{ inputs.plan_artifact_name }}\` |
          | **Triggered by** | @${{ github.actor }} |
          | **Commit**       | \`${{ github.sha }}\` |
          | **Run**          | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF

      # ── 10. Set output + fail if needed ──────────────────────────────
      - name: Set outcome output
        id: outcome
        if: always()
        run: |
          if [ "${{ inputs.plan_exitcode }}" = "0" ]; then
            echo "value=skipped"         >> $GITHUB_OUTPUT
          else
            echo "value=${OUTCOME:-failed}" >> $GITHUB_OUTPUT
          fi

      - name: Fail job on apply error
        if: env.APPLY_FAILED == 'true'
        run: exit 1
