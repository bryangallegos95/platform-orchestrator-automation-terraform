# ORG-DEVOPS/.github/workflows/tf-ci.yml
#
# Reusable CI workflow — triggered on Pull Request from product repos.
#
# DYNAMIC RESOLUTION (nothing hardcoded per environment):
#
#   github.base_ref (target branch of PR) → environment
#     dev     → runner: [self-hosted, terraform, dev]
#               bucket: s3-aw-ue1-terraform-state-dev
#     qa      → runner: [self-hosted, terraform, qa]
#               bucket: s3-aw-ue1-terraform-state-qa
#     preprod → runner: [self-hosted, terraform, preprod]
#               bucket: s3-aw-ue1-terraform-state-preprod
#     prod    → runner: [self-hosted, terraform, prod]
#               bucket: s3-aw-ue1-terraform-state-prod
#
#   state key → {ou_name}/{repo_name}/terraform.tfstate
#     ou_name  : comes from Port via workflow input
#     repo_name: github.event.repository.name (automatic)
#
#   account_id: comes from Port via workflow input
#
# AUTH MODEL:
#   Pod pivot role injected via IRSA (no explicit step needed).
#   One assume-role: pivot → target account (account_id dynamic, role name constant).
#
# JOBS:
#   1. resolve  → derives environment, bucket, state key, runner label
#   2. format   → terraform fmt -check
#   3. lint     → tflint with AWS ruleset
#   4. plan     → terraform validate + plan, posts output as PR comment

name: "[reusable] Terraform CI"

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to Terraform files. E.g. environments/dev"
        required: true
        type: string
      account_id:
        description: "AWS account ID for the target environment. Provided by Port."
        required: true
        type: string
      ou_name:
        description: "OU / product name used as the root folder in the state bucket. Provided by Port. E.g. nuevosnegocios"
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.10.5"
      tflint_version:
        required: false
        type: string
        default: "v0.55.0"
      target_role_name:
        description: "IAM role name in the target account. Identical across all accounts."
        required: false
        type: string
        default: "terraform-apply-role"
      aws_region:
        required: false
        type: string
        default: "us-east-1"
      bucket_prefix:
        description: "S3 bucket name prefix. Final name: {prefix}-{environment}"
        required: false
        type: string
        default: "s3-aw-ue1-terraform-state"

    outputs:
      plan_exitcode:
        description: "0=no changes, 2=changes present."
        value: ${{ jobs.plan.outputs.exitcode }}
      plan_artifact_name:
        description: "Artifact name to pass to tf-cd.yml."
        value: ${{ jobs.plan.outputs.artifact_name }}
      environment:
        description: "Resolved environment name."
        value: ${{ jobs.resolve.outputs.environment }}

concurrency:
  group: "tf-ci-${{ github.event.pull_request.number }}-${{ github.base_ref }}"
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  RESOLVE
  #  Derives all dynamic values from branch name.
  #  All subsequent jobs consume these outputs.
  # ─────────────────────────────────────────────
  resolve:
    name: "⓪ Resolve environment"
    runs-on: [self-hosted, terraform]

    outputs:
      environment:  ${{ steps.derive.outputs.environment }}
      bucket:       ${{ steps.derive.outputs.bucket }}
      state_key:    ${{ steps.derive.outputs.state_key }}
      runner_label: ${{ steps.derive.outputs.runner_label }}

    steps:
      - name: Derive environment from branch
        id: derive
        run: |
          # On PR events, use the target branch (base_ref).
          # On push events, use the branch being pushed to (ref_name).
          BRANCH="${{ github.base_ref || github.ref_name }}"
          REPO="${{ github.event.repository.name }}"
          OU="${{ inputs.ou_name }}"
          PREFIX="${{ inputs.bucket_prefix }}"

          case "$BRANCH" in
            dev)     ENV="dev"     ;;
            qa)      ENV="qa"      ;;
            preprod) ENV="preprod" ;;
            prod)    ENV="prod"    ;;
            *)
              echo "::error::Branch '$BRANCH' does not map to a known environment."
              echo "::error::Expected one of: dev, qa, preprod, prod."
              exit 1
              ;;
          esac

          BUCKET="${PREFIX}-${ENV}"
          STATE_KEY="${OU}/${REPO}/terraform.tfstate"
          RUNNER_LABEL="terraform,${ENV}"

          echo "environment=$ENV"        >> $GITHUB_OUTPUT
          echo "bucket=$BUCKET"          >> $GITHUB_OUTPUT
          echo "state_key=$STATE_KEY"    >> $GITHUB_OUTPUT
          echo "runner_label=$ENV"       >> $GITHUB_OUTPUT

          echo "### ⓪ Resolved values" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"        >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"               >> $GITHUB_STEP_SUMMARY
          echo "| Branch     | \`$BRANCH\`     |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment| \`$ENV\`         |" >> $GITHUB_STEP_SUMMARY
          echo "| Bucket     | \`$BUCKET\`      |" >> $GITHUB_STEP_SUMMARY
          echo "| State key  | \`$STATE_KEY\`   |" >> $GITHUB_STEP_SUMMARY
          echo "| Account ID | \`${{ inputs.account_id }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  #  FORMAT
  # ─────────────────────────────────────────────
  format:
    name: "① Format"
    needs: resolve
    # Runner label is derived from the environment — no hardcoding.
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: terraform fmt
        working-directory: ${{ inputs.working_directory }}
        run: terraform fmt -check -recursive -diff

  # ─────────────────────────────────────────────
  #  LINT
  # ─────────────────────────────────────────────
  lint:
    name: "② Lint"
    needs: resolve
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: Init TFLint
        working-directory: ${{ inputs.working_directory }}
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        working-directory: ${{ inputs.working_directory }}
        run: tflint --enable-plugin=aws --format=compact --recursive

  # ─────────────────────────────────────────────
  #  VALIDATE + PLAN
  # ─────────────────────────────────────────────
  plan:
    name: "③ Validate + Plan"
    needs: [resolve, format, lint]
    runs-on: [self-hosted, terraform, "${{ needs.resolve.outputs.runner_label }}"]

    outputs:
      exitcode:      ${{ steps.plan.outputs.exitcode }}
      artifact_name: ${{ steps.artifact_name.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      # One assume-role: IRSA pivot (already in pod) → target account.
      - name: Assume role in target account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::${{ inputs.account_id }}:role/${{ inputs.target_role_name }}"
          aws-region: ${{ inputs.aws_region }}
          role-session-name: "tf-ci-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}"

      - name: Terraform init
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.resolve.outputs.bucket }}" \
            -backend-config="key=${{ needs.resolve.outputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -input=false \
            -reconfigure

      - name: Terraform validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          set +e
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -input=false \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt
          EXITCODE=${PIPESTATUS[0]}
          echo "exitcode=$EXITCODE" >> $GITHUB_OUTPUT
          if [ "$EXITCODE" -eq "1" ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi
          exit 0

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ github.token }}
          script: |
            const fs  = require('fs');
            const raw = fs.readFileSync('${{ inputs.working_directory }}/plan_output.txt', 'utf8');
            const MAX = 65000;
            const planText = raw.length > MAX
              ? raw.slice(0, MAX) + '\n\n⚠️ Output truncated — see Actions for full log.'
              : raw;

            const exitcode  = '${{ steps.plan.outputs.exitcode }}';
            const noChanges = exitcode === '0';
            const env       = '${{ needs.resolve.outputs.environment }}';
            const bucket    = '${{ needs.resolve.outputs.bucket }}';
            const stateKey  = '${{ needs.resolve.outputs.state_key }}';
            const sha       = '${{ github.sha }}'.slice(0, 7);

            const body = [
              `## 🔍 Terraform Plan — \`${env}\` ${noChanges ? '✅ No changes' : '⚠️ Changes detected'}`,
              '',
              '| | |',
              '|---|---|',
              `| **Environment**  | \`${env}\` |`,
              `| **Account ID**   | \`${{ inputs.account_id }}\` |`,
              `| **Directory**    | \`${{ inputs.working_directory }}\` |`,
              `| **State bucket** | \`${bucket}\` |`,
              `| **State key**    | \`${stateKey}\` |`,
              `| **Commit**       | \`${sha}\` |`,
              `| **Triggered by** | @${{ github.actor }} |`,
              '',
              noChanges
                ? '> ℹ️ No infrastructure changes. Apply will be skipped in CD.'
                : '> ⚡ Plan saved. CD applies this **exact plan** after merge — no re-plan.',
              '',
              '<details><summary>📋 Plan output (expand)</summary>',
              '',
              '```hcl',
              planText,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot'
                && c.body.includes('Terraform Plan')
                && c.body.includes(`\`${env}\``)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

      - name: Build artifact name
        id: artifact_name
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ENV="${{ needs.resolve.outputs.environment }}"
          echo "value=tfplan-${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 5
          if-no-files-found: error
